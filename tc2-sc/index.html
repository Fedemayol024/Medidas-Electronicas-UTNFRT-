<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circuitos &amp; Señales Arcade · TC II + SC</title>
<style>
:root{
  --bg:#0b1210; --panel:#131d1a; --panel2:#1a2723; --line:#2a3d37;
  --ink:#e6f2ec; --dim:#8fa69c; --trace:#4dff9a; --amber:#ffb84d; --red:#ff6b6b; --blue:#6bc5ff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center}
main{width:100%;max-width:640px;padding:16px 14px 40px}
header{width:100%;max-width:640px;padding:18px 14px 4px;display:flex;align-items:center;gap:12px}
header h1{font-size:19px;margin:0;letter-spacing:.5px;color:var(--trace);text-shadow:0 0 12px rgba(77,255,154,.45)}
header p{margin:2px 0 0;font-size:12px;color:var(--dim)}
.logo{width:44px;height:44px;border:2px solid var(--line);border-radius:10px;background:#07100d;flex:none}
h2{font-size:17px;margin:4px 0 6px;color:var(--amber)}
p{line-height:1.5;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;color:var(--ink);font:inherit;cursor:pointer;transition:transform .08s,border-color .15s}
.card:hover,.card:focus-visible{border-color:var(--trace);outline:none}
.card:active{transform:scale(.98)}
.card .t{font-size:15px;font-weight:700;color:var(--trace)}
.card .d{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.45}
.card .b{font-size:12px;color:var(--amber);margin-top:8px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:var(--dim)}
.bar b{color:var(--ink)}
button.btn,a.btn{display:inline-flex;align-items:center;font:inherit;font-size:14px;font-weight:700;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:46px}
button.btn:hover,button.btn:focus-visible{border-color:var(--trace);outline:none}
button.btn.pri,a.btn.pri{background:var(--trace);color:#06140d;border-color:var(--trace)}
button.btn.ok{border-color:var(--trace);color:var(--trace)}
button.btn.bad{border-color:var(--red);color:var(--red)}
button.btn:disabled{opacity:.55;cursor:default}
.fpwrap{overflow-x:auto;border-radius:14px;-webkit-overflow-scrolling:touch;margin-top:6px}
svg.fp{display:block;width:100%;height:auto}
@media (max-width:620px){svg.fp{min-width:680px}}
svg.fp .lbl{fill:var(--pink);font-family:system-ui,-apple-system,sans-serif;font-weight:700}
svg.fp.quiz .lbl{display:none}
svg.fp .hit{fill:transparent}
svg.fp.explore .ctl{cursor:pointer}
svg.fp.explore .ctl:hover .hit{fill:rgba(77,255,154,.18)}
svg.fp .ring{fill:rgba(255,184,77,.14);stroke:#ff8a00;stroke-width:4;animation:ringp 1.1s ease-in-out infinite}
@keyframes ringp{50%{stroke-width:7;stroke:#ffd166}}
@media (prefers-reduced-motion: reduce){svg.fp .ring{animation:none}}
button.link{background:none;border:none;color:var(--blue);font:inherit;font-size:13px;cursor:pointer;padding:6px 0}
.opts{display:grid;gap:8px;margin-top:12px}
.opts.two{grid-template-columns:1fr 1fr}
.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:15px;line-height:1.5;min-height:84px}
.fb{margin-top:10px;font-size:13.5px;line-height:1.5;min-height:42px}
.fb.ok{color:var(--trace)} .fb.bad{color:var(--red)}
canvas{width:100%;display:block;background:#04100b;border:2px solid var(--line);border-radius:10px;touch-action:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.row label{font-size:13px;color:var(--dim)}
input[type=number]{font:inherit;font-size:16px;width:110px;background:#07100d;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
input[type=range]{width:100%;accent-color:var(--trace);height:34px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font:inherit;font-size:13px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:10px 13px;cursor:pointer}
.chip.used{opacity:.25;pointer-events:none}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:44px;margin-top:10px;font-size:13px}
.chain span{background:#0d2a1c;border:1px solid var(--trace);color:var(--trace);border-radius:8px;padding:7px 9px}
.chain i{color:var(--dim);font-style:normal}
.info{background:var(--panel);border-left:3px solid var(--amber);padding:10px 12px;border-radius:6px;font-size:13px;line-height:1.5;margin-top:10px;color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;font:inherit;font-size:13px;font-weight:700;background:var(--panel2);color:var(--dim);border:none;padding:11px 8px;cursor:pointer}
.seg button.on{background:var(--trace);color:#06140d}
.big{font-size:40px;color:var(--trace);text-align:center;margin:18px 0 4px;text-shadow:0 0 14px rgba(77,255,154,.4)}
.center{text-align:center}
footer{font-size:11px;color:var(--dim);padding:0 14px 24px;text-align:center;max-width:640px}
</style>
<style>
.sec{font-size:13px;font-weight:700;letter-spacing:.6px;color:var(--amber);margin:22px 0 2px;text-transform:uppercase}
.sec small{color:var(--dim);font-weight:400;letter-spacing:0;text-transform:none}
svg.ckt{display:block;width:100%;height:auto;background:#07100d;border:1px solid var(--line);border-radius:10px;margin-top:10px}
svg.ckt .w{stroke:#cfe8dc;stroke-width:2;fill:none}
svg.ckt .c{fill:#07100d;stroke:#cfe8dc;stroke-width:2}
svg.ckt .hl{stroke:var(--amber)}
svg.ckt text{fill:#cfe8dc;font:13px ui-monospace,Menlo,Consolas,monospace}
svg.ckt text.hl{fill:var(--amber);font-weight:700}
svg.ckt text.v{fill:var(--trace)}
.inp{display:grid;grid-template-columns:1fr auto;gap:6px 8px;align-items:center;margin-top:10px}
.inp label{font-size:13px;color:var(--dim)}
.inp .f{display:flex;gap:6px;align-items:center}
.inp input{font:inherit;font-size:16px;width:120px;background:#07100d;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
.inp input.ok{border-color:var(--trace)} .inp input.bad{border-color:var(--red)}
.inp span.u{font-size:13px;color:var(--dim);min-width:38px}
.eq{font-size:14px;background:#07100d;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px;color:var(--trace);overflow-x:auto;white-space:nowrap}
</style>
</head>
<body>
<header>
  <canvas class="logo" id="logo" width="88" height="88" aria-hidden="true"></canvas>
  <div><h1>CIRCUITOS &amp; SEÑALES</h1><p>TC II (24/11) + Sistemas de Comunicaciones (26/11) · práctica y teoría</p></div>
</header>
<main id="app"></main>
<footer>Ejercicios generados al azar con las fórmulas de las cátedras de Caneda y Peralta. Los puntajes y el avance se guardan solo en este dispositivo.</footer>

<script>
"use strict";
/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const app = $("#app");
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const LS = "cs-arcade";
let scores = {};
try { scores = JSON.parse(localStorage.getItem(LS) || "{}") || {}; } catch (e) { scores = {}; }
function saveBest(id, v) {
  if (!(id in scores) || v > scores[id]) { scores[id] = v; try { localStorage.setItem(LS, JSON.stringify(scores)); } catch (e) {} return true; }
  return false;
}
let timers = [], outs = [], raf = 0;
function clearAll() { timers.forEach(clearInterval); timers = []; outs.forEach(clearTimeout); outs = []; cancelAnimationFrame(raf); raf = 0; }
function later(fn, ms) { outs.push(setTimeout(fn, ms)); }
/* mazo: no repite ninguna clave hasta agotar todas; recuerda el avance entre partidas */
function deck(name, keys) {
  const K = "cs-deck-" + name, all = new Set(keys);
  let st = null; try { st = JSON.parse(localStorage.getItem(K) || "null"); } catch (e) {}
  let rest = st && Array.isArray(st.rest) ? st.rest.filter(k => all.has(k)) : null, done = st && Array.isArray(st.done) ? st.done.filter(k => all.has(k)) : [];
  if (!rest) rest = shuffle(keys); else { const known = new Set([...rest, ...done]); rest = rest.concat(shuffle(keys.filter(k => !known.has(k)))); }
  const used = new Set();
  const save = () => { try { localStorage.setItem(K, JSON.stringify({ rest, done })); } catch (e) {} };
  return () => {
    if (!rest.length) { const last = done[done.length - 1]; rest = shuffle(keys.filter(k => !used.has(k))); done = []; if (!rest.length) { used.clear(); rest = shuffle(keys); }
      if (rest.length > 1 && rest[0] === last) rest.push(rest.shift()); }
    const k = rest.shift(); used.add(k); done.push(k); save(); return k;
  };
}
/* generadores aleatorios: no repite una combinación entre las últimas 200 que salieron */
function fresh(name, gen, keyOf) {
  const K = "cs-recent-" + name; let rec = [];
  try { rec = JSON.parse(localStorage.getItem(K) || "[]") || []; } catch (e) {}
  let it, k, n = 0;
  do { it = gen(); k = keyOf(it); n++; } while (rec.includes(k) && n < 200);
  rec.push(k); if (rec.length > 200) rec = rec.slice(-200);
  try { localStorage.setItem(K, JSON.stringify(rec)); } catch (e) {}
  return it;
}
/* números en formato argentino */
function fmt(v, d = 2) { if (!isFinite(v)) return "—"; const p = Math.pow(10, d); return (Math.round(v * p) / p).toString().replace(".", ","); }
function sig(v, s = 3) { if (!isFinite(v) || v === 0) return fmt(v); const d = Math.max(0, s - 1 - Math.floor(Math.log10(Math.abs(v)))); return fmt(v, Math.min(d, 6)); }
const num = s => parseFloat(String(s).trim().replace(/\s/g, "").replace(",", "."));
const near = (v, ref, tol = 0.03) => isFinite(v) && (ref === 0 ? Math.abs(v) < 1e-9 : Math.abs(v - ref) / Math.abs(ref) <= tol);
const log10 = Math.log10;

/* campos numéricos: [{id,label,unit}] */
function fields(list) { return `<div class="inp">${list.map(f => `<label for="${f.id}">${f.label}</label><div class="f"><input id="${f.id}" type="text" inputmode="decimal" autocomplete="off"><span class="u">${f.unit || ""}</span></div>`).join("")}</div>`; }
function grade(list) { // [{id, ref, tol}] -> cantidad correcta, marca cada campo
  let ok = 0; list.forEach(f => { const el = $("#" + f.id), v = num(el.value), g = near(v, f.ref, f.tol || 0.03); el.classList.toggle("ok", g); el.classList.toggle("bad", !g); el.disabled = true; if (g) ok++; }); return ok;
}
function onEnter(cb) { app.querySelectorAll(".inp input").forEach(i => i.onkeydown = e => { if (e.key === "Enter") cb(); }); }

/* ---------- canvas ---------- */
function setupCanvas(cv, ratio = 0.6) {
  const w = cv.clientWidth || 600, dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(w * dpr); cv.height = Math.round(w * ratio * dpr);
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h: w * ratio };
}
function clear(ctx, w, h) { ctx.clearRect(0, 0, w, h); ctx.fillStyle = "#04100b"; ctx.fillRect(0, 0, w, h); }
function line(ctx, pts, color = "#4dff9a", lw = 2.2, glow = 8) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.shadowColor = color; ctx.shadowBlur = glow; ctx.lineJoin = "round";
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); ctx.restore();
}
function txt(ctx, s, x, y, color = "#8fa69c", size = 11, align = "left") { ctx.save(); ctx.fillStyle = color; ctx.font = size + "px ui-monospace,Menlo,Consolas,monospace"; ctx.textAlign = align; ctx.fillText(s, x, y); ctx.restore(); }

/* ---------- dibujos de circuitos (SVG) ---------- */
function R(x1, y1, x2, y2, lb, cls = "", side = 1) { // resistencia entre dos puntos (horizontal o vertical)
  const h = y1 === y2, mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  if (h) return `<path class="w ${cls}" d="M${x1} ${y1}H${mx - 22}M${mx + 22} ${y1}H${x2}"/><rect class="c ${cls}" x="${mx - 22}" y="${y1 - 8}" width="44" height="16" rx="2"/><text class="${cls}" x="${mx}" y="${y1 - 14 * side + (side < 0 ? 10 : 0)}" text-anchor="middle">${lb}</text>`;
  return `<path class="w ${cls}" d="M${x1} ${y1}V${my - 22}M${x1} ${my + 22}V${y2}"/><rect class="c ${cls}" x="${x1 - 8}" y="${my - 22}" width="16" height="44" rx="2"/><text class="${cls}" x="${x1 + 14 * side}" y="${my + 4}" text-anchor="${side > 0 ? "start" : "end"}">${lb}</text>`;
}
function C(x1, y1, x2, y2, lb, cls = "", side = 1) {
  const h = y1 === y2, mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  if (h) return `<path class="w ${cls}" d="M${x1} ${y1}H${mx - 5}M${mx + 5} ${y1}H${x2}M${mx - 5} ${y1 - 12}V${y1 + 12}M${mx + 5} ${y1 - 12}V${y1 + 12}"/><text class="${cls}" x="${mx}" y="${y1 - 17 * side + (side < 0 ? 12 : 0)}" text-anchor="middle">${lb}</text>`;
  return `<path class="w ${cls}" d="M${x1} ${y1}V${my - 5}M${x1} ${my + 5}V${y2}M${x1 - 12} ${my - 5}H${x1 + 12}M${x1 - 12} ${my + 5}H${x1 + 12}"/><text class="${cls}" x="${x1 + 17 * side}" y="${my + 4}" text-anchor="${side > 0 ? "start" : "end"}">${lb}</text>`;
}
function L(x1, y1, x2, y2, lb, cls = "", side = 1) {
  const h = y1 === y2, mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  if (h) { let d = `M${x1} ${y1}H${mx - 24}`; for (let i = 0; i < 4; i++) d += `a6 6 0 0 1 12 0`; d += `M${mx + 24} ${y1}H${x2}`; return `<path class="w ${cls}" d="${d}"/><text class="${cls}" x="${mx}" y="${y1 - 12 * side + (side < 0 ? 10 : 0)}" text-anchor="middle">${lb}</text>`; }
  let d = `M${x1} ${y1}V${my - 24}`; for (let i = 0; i < 4; i++) d += `a6 6 0 0 1 0 12`; d += `M${x1} ${my + 24}V${y2}`;
  return `<path class="w ${cls}" d="${d}"/><text class="${cls}" x="${x1 + 14 * side}" y="${my + 4}" text-anchor="${side > 0 ? "start" : "end"}">${lb}</text>`;
}
const W = d => `<path class="w" d="${d}"/>`;
const dot = (x, y) => `<circle cx="${x}" cy="${y}" r="3" fill="#cfe8dc"/>`;
const gnd = (x, y) => `<path class="w" d="M${x} ${y}v6M${x - 10} ${y + 6}h20M${x - 6} ${y + 10}h12M${x - 2} ${y + 14}h4"/>`;
const T = (x, y, s, cls = "", a = "middle") => `<text class="${cls}" x="${x}" y="${y}" text-anchor="${a}">${s}</text>`;
const svg = (w, h, inner) => `<svg class="ckt" viewBox="0 0 ${w} ${h}" role="img">${inner}</svg>`;
function opamp(x, y) { // x,y: entrada no inversora; devuelve salida en (x+70, y-14)
  return `<path class="c" d="M${x} ${y - 42}L${x + 70} ${y - 14}L${x} ${y + 14}Z"/><text x="${x + 6}" y="${y + 4}">+</text><text x="${x + 6}" y="${y - 22}">−</text>`;
}

/* ---------- menú ---------- */
const GAMES = [
  { sec: "tc", id: "vftc", t: "V o F relámpago · TC II", d: "60 segundos de teoría: atenuadores, filtros pasivos y activos, discretos, IIR y FIR.", unit: "aciertos" },
  { sec: "tc", id: "aten", t: "Diseñá el atenuador", d: "T o π simétrico: calculá las resistencias para Z₀ y la atenuación pedidas.", unit: "/10" },
  { sec: "tc", id: "kconst", t: "K constante y derivada m", d: "Calculá L y C del prototipo pasa bajos o pasa altos, y el m de la sección derivada.", unit: "/10" },
  { sec: "tc", id: "butter", t: "Butterworth: orden y escalera", d: "De la plantilla al orden n, y de los coeficientes g a las bobinas y capacitores reales.", unit: "/10" },
  { sec: "tc", id: "sk", t: "Sallen-Key", d: "Procedimientos de las diapositivas: calculá la R para la frecuencia de corte pedida.", unit: "/6" },
  { sec: "tc", id: "bode", t: "¿Qué filtro es?", d: "Mirá la respuesta en frecuencia: tipo, orden por la pendiente y aproximación.", unit: "/8" },
  { sec: "tc", id: "zplano", t: "Plano Z", d: "Ecuación en diferencias y polos y ceros: ¿estable? ¿FIR o IIR? ¿qué filtro? ¿cuánto vale h[n]?", unit: "/8" },
  { sec: "tc", id: "iirfir", t: "IIR o FIR", d: "Clasificá cada característica o aplicación en la familia que corresponde.", unit: "/12" },
  { sec: "sc", id: "vfsc", t: "V o F relámpago · SC", d: "60 segundos: PCM, compansión, DM, códigos de línea, ISI, PSK y QAM.", unit: "aciertos" },
  { sec: "sc", id: "pcm", t: "PCM completo", d: "Rb, SQNR y banda de guarda; después ves el espectro muestreado, como en el criterio visual.", unit: "/15" },
  { sec: "sc", id: "linea", t: "Códigos de línea", d: "Reconocé el código por la forma de onda y su ancho de banda al primer nulo.", unit: "/12" },
  { sec: "sc", id: "mod", t: "Constelaciones", d: "Reconocé la modulación y calculá baudios y ancho de banda de Nyquist.", unit: "/18" },
  { sec: "sc", id: "ojo", t: "Diagrama de ojo", d: "¿Ruido, jitter o ISI? Diagnosticá el enlace mirando el ojo.", unit: "/6" }
];
function home() {
  clearAll();
  const card = g => `<button class="card" data-g="${g.id}"><div class="t">${g.t}</div><div class="d">${g.d}</div><div class="b">${g.id in scores ? "Récord: " + scores[g.id] + " " + g.unit : "Sin jugar"}</div></button>`;
  app.innerHTML = `<p>Práctica y teoría para los dos parciales que vienen. Los ejercicios salen al azar y no se repiten hasta agotar cada banco.</p>
  <div class="row" style="justify-content:center"><a class="btn pri" href="Guia_Conjunta_TC2_SC_Celular.pdf" target="_blank" rel="noopener" style="text-decoration:none">📄 Guía conjunta (celular)</a><a class="btn" href="Guia_Conjunta_TC2_SC_PC.pdf" target="_blank" rel="noopener" style="text-decoration:none">📄 Versión A4</a></div>
  <div class="sec">Teoría de Circuitos II <small>· martes 24/11 · Caneda</small></div>
  <div class="grid">${GAMES.filter(g => g.sec === "tc").map(card).join("")}</div>
  <div class="sec">Sistemas de Comunicaciones <small>· jueves 26/11 · Peralta</small></div>
  <div class="grid">${GAMES.filter(g => g.sec === "sc").map(card).join("")}</div>
  <div class="row" style="justify-content:center;margin-top:18px"><a class="btn" href="../" style="text-decoration:none">← Osciloscopio Arcade (Medidas)</a></div>`;
  app.querySelectorAll(".card").forEach(b => b.onclick = () => START[b.dataset.g]());
  window.scrollTo(0, 0);
}
function shell(title, inner) {
  clearAll();
  app.innerHTML = `<button class="link" id="back">← Volver al menú</button><h2>${title}</h2>${inner}`;
  $("#back").onclick = home; window.scrollTo(0, 0);
}
function finish(id, score, unit, msg) {
  clearAll();
  const best = saveBest(id, score);
  app.innerHTML = `<button class="link" id="back">← Volver al menú</button><div class="big">${score} ${unit}</div>
  <p class="center">${best ? "¡Nuevo récord!" : "Récord: " + scores[id] + " " + unit}</p><p class="center">${msg || ""}</p>
  <div class="row" style="justify-content:center"><button class="btn pri" id="again">Jugar de nuevo</button><button class="btn" id="menu">Menú</button></div>`;
  $("#back").onclick = home; $("#menu").onclick = home; $("#again").onclick = () => START[id]();
}
const START = {};

/* esqueleto de rondas de opción múltiple */
function mcRound(opts, ans, onDone, cols2 = true) {
  $("#o").className = "opts" + (cols2 ? " two" : "");
  $("#o").innerHTML = opts.map(o => `<button class="btn" style="text-align:left">${esc(o)}</button>`).join("");
  $("#o").querySelectorAll("button").forEach(b => b.onclick = () => {
    const ok = b.textContent === ans;
    $("#o").querySelectorAll("button").forEach(x => { x.disabled = true; if (x.textContent === ans) x.classList.add("ok"); });
    if (!ok) b.classList.add("bad"); onDone(ok);
  });
}

/* ---------- V o F ---------- */
const VFTC = [
  ["Un atenuador ideal está formado solo por resistencias.", true, "Así atenúa igual a todas las frecuencias y no desfasa."],

function vfGame(id, title, bank) {
  const draw = deck(id, bank.map(v => v[0])), byQ = new Map(bank.map(v => [v[0], v]));
  let it = null, score = 0, left = 60, lock = false;
  shell(title, `<div class="bar"><span>Tiempo: <b id="tm">60</b> s</span><span>Aciertos: <b id="sc">0</b></span></div>
    <div class="q" id="q"></div><div class="opts two"><button class="btn" id="bv">VERDADERO</button><button class="btn" id="bf">FALSO</button></div><div class="fb" id="fb"></div>`);
  const show = () => { it = byQ.get(draw()); $("#q").textContent = it[0]; };
  const ans = v => {
    if (lock) return; const q = it, ok = v === q[1];
    if (ok) { score++; $("#sc").textContent = score; $("#fb").className = "fb ok"; $("#fb").textContent = "✔ " + q[2]; show(); }
    else { lock = true; $("#fb").className = "fb bad"; $("#fb").textContent = "✘ " + (q[1] ? "Era verdadero. " : "Era falso. ") + q[2]; later(() => { lock = false; if (left > 0) show(); }, 1900); }
  };
  $("#bv").onclick = () => ans(true); $("#bf").onclick = () => ans(false);
  timers.push(setInterval(() => { left--; $("#tm").textContent = left; if (left <= 0) finish(id, score, "aciertos", "Repasá las justificaciones: en el parcial los V/F se justifican."); }, 1000));
  show();
}

/* ---------- formateo de componentes ---------- */
function ohm(v) { return v >= 1e6 ? sig(v / 1e6) + " MΩ" : v >= 1e3 ? sig(v / 1e3) + " kΩ" : sig(v) + " Ω"; }
function far(v) { return v >= 1e-6 ? sig(v * 1e6) + " µF" : v >= 1e-9 ? sig(v * 1e9) + " nF" : sig(v * 1e12) + " pF"; }
function hen(v) { return v >= 1 ? sig(v) + " H" : v >= 1e-3 ? sig(v * 1e3) + " mH" : sig(v * 1e6) + " µH"; }
function hz(v) { return v >= 1e6 ? sig(v / 1e6) + " MHz" : v >= 1e3 ? sig(v / 1e3) + " kHz" : sig(v) + " Hz"; }

/* ---------- Diseñá el atenuador ---------- */
function atenSVG(type, s, p, Z0) {
  const end = `<circle cx="30" cy="40" r="4" class="c"/><circle cx="30" cy="140" r="4" class="c"/>` + T(30, 168, "entrada") + R(372, 40, 372, 140, "Z₀=" + Z0 + "Ω", "", 1) + W("M330 40H372M330 140H372") + T(345, 22, "carga");
  if (type === "T") return svg(460, 180, end + R(30, 40, 180, 40, s[0], s[1]) + R(180, 40, 330, 40, s[0], s[1]) + R(180, 40, 180, 140, p[0], p[1]) + W("M30 140H330") + dot(180, 40) + dot(180, 140));
  return svg(460, 180, end + W("M30 40H80M280 40H330M30 140H330") + R(80, 40, 80, 140, p[0], p[1], 1) + R(280, 40, 280, 140, p[0], p[1], -1) + R(80, 40, 280, 40, s[0], s[1]) + dot(80, 40) + dot(280, 40) + dot(80, 140) + dot(280, 140));
}
START.aten = function () {
  const N = 5; let round = 0, score = 0, cur;
  shell("Diseñá el atenuador", `<div class="bar"><span>Ejercicio <b id="n">1</b>/${N}</span><span>Puntos: <b id="sc">0</b>/${2 * N}</span></div>
    <div class="info" id="set"></div><div id="fig"></div><div id="flds"></div>
    <div class="row"><button class="btn pri" id="go">Comprobar</button><button class="btn" id="hint">Fórmulas</button></div><div class="fb" id="fb"></div>`);
  const next = () => {
    cur = fresh("aten", () => {
      const type = pick(["T", "π"]), Z0 = pick([50, 75, 300, 600]), A = pick([3, 6, 10, 12, 14, 20, 26, 30]), K = Math.pow(10, A / 20);
      const rs = type === "T" ? Z0 * (K - 1) / (K + 1) : Z0 * (K * K - 1) / (2 * K), rp = type === "T" ? Z0 * 2 * K / (K * K - 1) : Z0 * (K + 1) / (K - 1);
      return { type, Z0, A, K, rs, rp };
    }, c => c.type + c.Z0 + "-" + c.A);
    $("#n").textContent = round + 1; $("#fb").textContent = ""; $("#fb").className = "fb";
    $("#set").innerHTML = `Atenuador <b>${cur.type}</b> simétrico de <b>${cur.A} dB</b> para una línea de <b>Z₀ = ${cur.Z0} Ω</b>. Calculá la resistencia serie y la paralelo.`;
    $("#fig").innerHTML = atenSVG(cur.type, ["Rs = ?", "hl"], ["Rp = ?", "hl"], cur.Z0);
    $("#flds").innerHTML = fields([{ id: "rs", label: "R serie", unit: "Ω" }, { id: "rp", label: "R paralelo", unit: "Ω" }]);
    $("#go").textContent = "Comprobar"; $("#go").onclick = check; onEnter(check); $("#rs").focus({ preventScroll: true });
  };
  $("#hint").onclick = () => { $("#fb").className = "fb"; $("#fb").innerHTML = "K = 10^(A/20).<br>T: Rserie = Z₀(K−1)/(K+1); Rparalelo = 2Z₀K/(K²−1).<br>π: Rparalelo = Z₀(K+1)/(K−1); Rserie = Z₀(K²−1)/(2K)."; };
  const check = () => {
    const ok = grade([{ id: "rs", ref: cur.rs, tol: 0.02 }, { id: "rp", ref: cur.rp, tol: 0.02 }]); score += ok; $("#sc").textContent = score;
    $("#fig").innerHTML = atenSVG(cur.type, [ohm(cur.rs), "v"], [ohm(cur.rp), "v"], cur.Z0);
    const K = cur.K, f = cur.type === "T" ? `Rserie = ${cur.Z0}·(${fmt(K, 3)}−1)/(${fmt(K, 3)}+1) = <b>${fmt(cur.rs, 1)} Ω</b><br>Rparalelo = 2·${cur.Z0}·${fmt(K, 3)}/(${fmt(K, 3)}²−1) = <b>${fmt(cur.rp, 1)} Ω</b>`
      : `Rparalelo = ${cur.Z0}·(${fmt(K, 3)}+1)/(${fmt(K, 3)}−1) = <b>${fmt(cur.rp, 1)} Ω</b><br>Rserie = ${cur.Z0}·(${fmt(K, 3)}²−1)/(2·${fmt(K, 3)}) = <b>${fmt(cur.rs, 1)} Ω</b>`;
    $("#fb").className = "fb " + (ok === 2 ? "ok" : "bad"); $("#fb").innerHTML = `${ok === 2 ? "✔ Perfecto." : ok ? "✘ Una de dos." : "✘ Revisalo."} K = 10^(${cur.A}/20) = ${fmt(K, 3)}<br>${f}<br><span style="color:var(--dim)">Con Z₀ conectada, la entrada vale ${cur.Z0} Ω y V₁/V₂ = K.</span>`;
    round++; $("#go").textContent = round < N ? "Siguiente" : "Ver resultado"; $("#go").onclick = () => round < N ? next() : finish("aten", score, "/10", "Dos condiciones: entrada = Z₀ con la carga puesta, y V₁/V₂ = K.");
  };
  next();
};

/* ---------- K constante y derivada m ---------- */
function kSVG(lp, a, b) {
  const end = W("M30 40H60M300 40H330M30 140H330") + `<circle cx="30" cy="40" r="4" class="c"/><circle cx="30" cy="140" r="4" class="c"/><circle cx="330" cy="40" r="4" class="c"/><circle cx="330" cy="140" r="4" class="c"/>` + dot(180, 40) + dot(180, 140);
  return lp ? svg(360, 170, end + L(60, 40, 180, 40, a[0], a[1]) + L(180, 40, 300, 40, a[0], a[1]) + C(180, 40, 180, 140, b[0], b[1]))
    : svg(360, 170, end + C(60, 40, 180, 40, b[0], b[1]) + C(180, 40, 300, 40, b[0], b[1]) + L(180, 40, 180, 140, a[0], a[1]));
}
START.kconst = function () {
  const N = 5; let round = 0, score = 0, cur;
  shell("K constante y derivada m", `<div class="bar"><span>Ejercicio <b id="n">1</b>/${N}</span><span>Puntos: <b id="sc">0</b>/${2 * N}</span></div>
    <div class="info" id="set"></div><div id="fig"></div><div id="flds"></div>
    <div class="row"><button class="btn pri" id="go">Comprobar</button><button class="btn" id="hint">Fórmulas</button></div><div class="fb" id="fb"></div>`);
  const next = () => {
    const mRound = round === N - 1 || (round === 2 && Math.random() < 0.4);

/* ---------- Butterworth: orden y escalera ---------- */
START.butter = function () {

          const e = Math.sqrt(Math.pow(10, Ap / 10) - 1), d = Math.sqrt(Math.pow(10, As / 10) - 1), nn = log10(d / e) / log10(r); o = { ord: true, Ap, As, fp, fs: fp * r, e, d, nr: nn, n: Math.ceil(nn - 1e-9) }; } while (o.n < 2 || o.n > 7); return o; },

      $("#fig").innerHTML = ""; $("#flds").innerHTML = fields([{ id: "a", label: "δ", unit: "" }, { id: "b", label: "orden n", unit: "" }]);
    } else {

        const g = Array.from({ length: n }, (_, k) => 2 * Math.sin((2 * k + 1) * Math.PI / (2 * n))); return { ord: false, n, Rn, fc, w, g, L1: g[0] * Rn / w, C2: g[1] / (Rn * w) }; },

      $("#fig").innerHTML = svg(420, 160, W("M20 40H40M20 130H400") + L(40, 40, 140, 40, "L₁ = ?", "hl") + C(140, 40, 140, 130, "C₂ = ?", "hl") + (cur.n >= 3 ? L(140, 40, 250, 40, "L₃") : W("M140 40H250")) + (cur.n >= 4 ? C(250, 40, 250, 130, "C₄") : "") + W("M250 40H360") + R(360, 40, 360, 130, "R", "", -1) + dot(140, 40) + dot(140, 130));

  const check = () => {

/* ---------- Sallen-Key ---------- */
function skSVG(lp, lb) { // lb: {s1,s2,top,bot} -> [texto, clase]

  const ser = (x1, x2, l) => lp ? R(x1, 110, x2, 110, l[0], l[1], -1) : C(x1, 110, x2, 110, l[0], l[1], -1);
  const top = lp ? C(120, 34, 350, 34, tp[0], tp[1]) : R(120, 34, 350, 34, tp[0], tp[1]);
  const bot = lp ? C(220, 110, 220, 172, bt[0], bt[1], 1) : R(220, 110, 220, 172, bt[0], bt[1], 1);
  return svg(420, 200, T(14, 114, "Eᵢ", "", "start") + W("M32 110H36") + ser(36, 120, s1) + ser(120, 220, s2) + W("M220 110H250M120 110V34M350 34V96M320 96H400M250 82H236V58H350") + top + bot + gnd(220, 172) + opamp(250, 110) + dot(120, 110) + dot(220, 110) + dot(350, 96) + dot(350, 58) + T(404, 100, "Vₒ", "", "start"));
}

    round++; $("#go").textContent = round < N ? "Siguiente" : "Ver resultado"; $("#go").onclick = () => round < N ? next() : finish("sk", score, "/6", "PB: C₂ = 2C₁ y R = 0,707/(ωcC₁). PA: R₁ = 1,414/(ωcC) y R₂ = R₁/2.");

/* ---------- ¿Qué filtro es? (respuesta en frecuencia) ---------- */
function cabs(re, im) { return Math.sqrt(re * re + im * im); }
function besselMag(x) { // Bessel orden 4, normalizado a −3 dB en x = 1
  const w = x * 2.1139; // corte de −3 dB del polinomio de retardo unitario
  const re = Math.pow(w, 4) - 45 * w * w + 105, im = -10 * Math.pow(w, 3) + 105 * w;
  return 105 / cabs(re, im);
}
function chebyMag(x, n = 4, rip = 2) { const e2 = Math.pow(10, rip / 10) - 1; const Tn = x <= 1 ? Math.cos(n * Math.acos(x)) : Math.cosh(n * Math.acosh(x)); return 1 / Math.sqrt(1 + e2 * Tn * Tn); }
const butMag = (x, n) => 1 / Math.sqrt(1 + Math.pow(x, 2 * n));
const BODES = {
  LP1: { f: x => butMag(x, 1), ans: "Pasa bajos, orden 1", why: "Plano y después −20 dB/década: un solo polo." },
  LP2: { f: x => butMag(x, 2), ans: "Pasa bajos, orden 2", why: "Cae 40 dB por década (de 0 a −40 entre fc y 10fc)." },
  LP3: { f: x => butMag(x, 3), ans: "Pasa bajos, orden 3", why: "Cae 60 dB por década." },
  HP1: { f: x => butMag(1 / x, 1), ans: "Pasa altos, orden 1", why: "Sube 20 dB por década hasta fc." },
  HP2: { f: x => butMag(1 / x, 2), ans: "Pasa altos, orden 2", why: "Sube 40 dB por década hasta fc." },
  HP3: { f: x => butMag(1 / x, 3), ans: "Pasa altos, orden 3", why: "Sube 60 dB por década hasta fc." },
  BP: { f: x => butMag(x / 3, 2) * butMag(0.33 / x, 2), ans: "Pasa banda", why: "Atenúa por debajo y por encima: pasa altos y pasa bajos en cascada." },
  BS: { f: x => { const q = 0.7, a = 1 - x * x; return Math.abs(a) / Math.sqrt(a * a + Math.pow(x / q, 2)); }, ans: "Elimina banda", why: "Pasa todo menos una banda alrededor de f₀ (un notch)." },
  butter: { f: x => butMag(x, 4), ans: "Butterworth", why: "Banda pasante máximamente plana, sin rizado, y corte intermedio.", ap: true },
  cheby: { f: x => chebyMag(x), ans: "Chebyshev", why: "Rizado (ondulación) en la banda pasante a cambio del corte más abrupto.", ap: true },
  bessel: { f: x => besselMag(x), ans: "Bessel", why: "Empieza a caer antes y cae más lento: prioriza la fase lineal.", ap: true }
};
function drawBode(cv, f, center) {
  const { ctx, w, h } = setupCanvas(cv, 0.62); clear(ctx, w, h);
  const L = 44, Rr = 10, Tt = 12, B = 30, dbMax = 10, dbMin = -80, xd = (w - L - Rr) / 4;
  const X = d => L + (d + 2) * xd, Y = db => Tt + (dbMax - db) / (dbMax - dbMin) * (h - Tt - B);
  ctx.strokeStyle = "rgba(120,170,150,.25)"; ctx.lineWidth = 1;
  for (let d = -2; d <= 2; d++) { for (let k = 1; k < 10; k++) { const x = X(d + log10(k)); if (x > w - Rr) break; ctx.globalAlpha = k === 1 ? 1 : 0.35; ctx.beginPath(); ctx.moveTo(x, Tt); ctx.lineTo(x, h - B); ctx.stroke(); } }
  ctx.globalAlpha = 1;
  for (let db = 0; db >= -80; db -= 20) { ctx.beginPath(); ctx.moveTo(L, Y(db)); ctx.lineTo(w - Rr, Y(db)); ctx.stroke(); txt(ctx, db + " dB", L - 4, Y(db) + 4, "#8fa69c", 10, "right"); }
  ctx.save(); ctx.setLineDash([4, 4]); ctx.strokeStyle = "rgba(255,184,77,.55)"; ctx.beginPath(); ctx.moveTo(L, Y(-3)); ctx.lineTo(w - Rr, Y(-3)); ctx.stroke(); ctx.restore();
  txt(ctx, "−3", w - Rr - 2, Y(-3) - 3, "#ffb84d", 9, "right");
  const lab = center ? ["0,01f₀", "0,1f₀", "f₀", "10f₀", "100f₀"] : ["0,01fc", "0,1fc", "fc", "10fc", "100fc"];
  lab.forEach((s, i) => txt(ctx, s, X(i - 2), h - B + 16, "#8fa69c", 10, i === 0 ? "left" : i === 4 ? "right" : "center"));
  const pts = []; for (let i = 0; i <= 400; i++) { const d = -2 + 4 * i / 400, x = Math.pow(10, d); let db = 20 * log10(Math.max(f(x), 1e-6)); db = Math.max(dbMin, Math.min(dbMax, db)); pts.push([X(d), Y(db)]); }
  line(ctx, pts);
}
START.bode = function () {
  const N = 8, keys = Object.keys(BODES), draw = deck("bode", keys); let round = 0, score = 0;

    <div class="q" id="q" style="min-height:0;margin-top:10px"></div><div id="o"></div><div class="fb" id="fb"></div>`);
  const next = () => {

    cur = fresh("mod", () => ({ key, Rb: pick([12, 24, 30, 36, 45, 48, 60, 90, 120]), a: pick([0, 0.2, 0.25, 0.35, 0.5]) }), c => c.key + c.Rb + "-" + c.a);
    cur.M = M; cur.Rs = cur.Rb / M.k; cur.B = cur.Rs * (1 + cur.a);
    $("#n").textContent = round + 1; $("#fb").textContent = ""; $("#flds").innerHTML = ""; $("#gorow").style.display = "none";
    drawConst($("#cv"), M.pts()); $("#q").textContent = "¿Qué modulación muestra la constelación?";
    mcRound(shuffle(Object.values(MODS).map(m => m.name)).slice(0, 6), M.name, ok => {
      if (ok) { score++; $("#sc").textContent = score; } $("#fb").className = "fb " + (ok ? "ok" : "bad"); $("#fb").textContent = (ok ? "✔ " : "✘ Es " + M.name + ". ") + M.why;
      later(() => {
        $("#o").innerHTML = ""; $("#q").innerHTML = `Enlace <b>${M.name}</b> a <b>Rb = ${cur.Rb} Mbps</b> con roll-off <b>α = ${fmt(cur.a)}</b>. Calculá la tasa de símbolos y el ancho de banda pasabanda de Nyquist.`;
        $("#flds").innerHTML = fields([{ id: "a", label: "Rs", unit: "MBd" }, { id: "b", label: "B = Rs(1+α)", unit: "MHz" }]); $("#gorow").style.display = "flex"; $("#fb").textContent = "";
        const check = () => {
          const g = grade([{ id: "a", ref: cur.Rs, tol: 0.01 }, { id: "b", ref: cur.B, tol: 0.01 }]); score += g; $("#sc").textContent = score;
          $("#fb").className = "fb " + (g === 2 ? "ok" : "bad"); $("#fb").innerHTML = `${g === 2 ? "✔" : "✘"} k = log₂M = ${M.k}; Rs = ${cur.Rb}/${M.k} = <b>${fmt(cur.Rs)} MBd</b>; B = ${fmt(cur.Rs)}·(1 + ${fmt(cur.a)}) = <b>${fmt(cur.B)} MHz</b>; η = ${fmt(cur.Rb / cur.B)} bps/Hz.`;
          round++; $("#go").textContent = round < N ? "Siguiente" : "Ver resultado"; $("#go").onclick = () => round < N ? ($("#go").textContent = "Comprobar", next()) : finish("mod", score, "/18", "Rs = Rb/log₂M; B = Rs(1+α). Más bits por símbolo: menos ancho de banda, más SNR.");
        };
        $("#go").textContent = "Comprobar"; $("#go").onclick = check; onEnter(check);
      }, ok ? 1300 : 2400);
    }, true);
  };
  next();
};

/* ---------- Diagrama de ojo ---------- */
const EYES = {
  sano: { ans: "Ojo bien abierto: enlace sano", why: "Apertura vertical grande (margen de ruido) y cruces finos (buena temporización)." },
  ruido: { ans: "Ruido: el ojo se cierra en vertical", why: "Las trazas se engrosan arriba y abajo: queda poco margen para decidir el nivel." },
  jitter: { ans: "Jitter: cruces dispersos, ojo angosto", why: "Los cruces por cero se desparraman en el tiempo: se reduce la apertura horizontal (tolerancia al instante de muestreo)." },
  isi: { ans: "ISI fuerte: el ojo casi cerrado", why: "Los símbolos vecinos se meten en el actual: niveles intermedios y ojo cerrado. Se corrige con un ecualizador y cumpliendo Nyquist." }
};
function gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function drawEye(cv, kind) {
  const { ctx, w, h } = setupCanvas(cv, 0.6); clear(ctx, w, h);
  const S = 40, Nsym = 160, a = Array.from({ length: Nsym }, () => Math.random() < 0.5 ? -1 : 1), al = 0.5;
  const rc = t => { if (Math.abs(t) < 1e-9) return 1; const s = Math.sin(Math.PI * t) / (Math.PI * t), d = 1 - Math.pow(2 * al * t, 2); return Math.abs(d) < 1e-6 ? s * Math.PI / 4 : s * Math.cos(Math.PI * al * t) / d; };
  const jit = a.map(() => kind === "jitter" ? 0.16 * gauss() : 0);
  const sg = []; for (let i = 0; i < Nsym * S; i++) { const t = i / S; let v = 0; for (let k = Math.max(0, Math.floor(t) - 6); k < Math.min(Nsym, Math.floor(t) + 7); k++) v += a[k] * rc(t - k - jit[k]); sg.push(v); }
  let y = sg;
  if (kind === "isi") { const out = []; let s = 0; const b = 0.05; sg.forEach(v => { s += (v - s) * b; out.push(s); }); y = out.map(v => v * 1.7); }
  if (kind === "ruido") y = y.map(v => v + 0.17 * gauss());
  const mid = h / 2, A = h * 0.3, X = i => (i / (2 * S)) * w;
  ctx.strokeStyle = "rgba(120,170,150,.25)"; ctx.beginPath(); ctx.moveTo(0, mid); ctx.lineTo(w, mid); ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h); ctx.stroke();
  ctx.save(); ctx.strokeStyle = "rgba(77,255,154,.18)"; ctx.lineWidth = 1.4;
  for (let k = 8; k < Nsym - 8; k++) { const st = k * S - S / 2 + (kind === "isi" ? 14 : 0); ctx.beginPath(); for (let i = 0; i <= 2 * S; i++) { const v = y[st + i]; const px = X(i), py = mid - v * A; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); } ctx.stroke(); }
  ctx.restore(); txt(ctx, "instante de muestreo", w / 2 + 4, 14, "#ffb84d", 10);
}
START.ojo = function () {
  const N = 6, keys = Object.keys(EYES).flatMap(k => [k + "|0", k + "|1", k + "|2"]), draw = deck("ojo", keys); let round = 0, score = 0;
  shell("Diagrama de ojo", `<div class="bar"><span>Enlace <b id="n">1</b>/${N}</span><span>Aciertos: <b id="sc">0</b></span></div><canvas id="cv"></canvas>
    <div class="q" id="q" style="min-height:0;margin-top:10px">Mirá el ojo en el receptor. ¿Qué está pasando?</div><div id="o"></div><div class="fb" id="fb"></div>`);
  const next = () => {
    const k = draw().split("|")[0], E = EYES[k]; $("#n").textContent = round + 1; $("#fb").textContent = ""; drawEye($("#cv"), k);
    mcRound(shuffle(Object.values(EYES).map(e => e.ans)), E.ans, ok => { if (ok) { score++; $("#sc").textContent = score; } $("#fb").className = "fb " + (ok ? "ok" : "bad"); $("#fb").textContent = (ok ? "✔ " : "✘ Era: " + E.ans + ". ") + E.why;
      later(() => { round++; round < N ? next() : finish("ojo", score, "/6", "Vertical: margen de ruido. Horizontal: tolerancia de temporización. ISI: ecualizador."); }, ok ? 1800 : 3000); }, false);
  };
  next();
};

/* ---------- logo animado ---------- */
(function () {
  const c = $("#logo"), x = c.getContext("2d"); let t = 0;
  const still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const d = () => { x.clearRect(0, 0, 88, 88); x.lineWidth = 3; x.shadowBlur = 8;
    x.strokeStyle = "#ffb84d"; x.shadowColor = "#ffb84d"; x.beginPath(); for (let i = 0; i <= 88; i += 2) { const y = 30 - 14 * Math.sin(i / 10 + t); i ? x.lineTo(i, y) : x.moveTo(i, y); } x.stroke();
    x.strokeStyle = "#4dff9a"; x.shadowColor = "#4dff9a"; x.beginPath(); for (let i = 0; i <= 88; i += 11) { const y = 64 - 12 * Math.sign(Math.sin(i / 11 * 1.7 + t * 0.6)); x.moveTo(i + 2, 66); x.lineTo(i + 2, y); } x.stroke();
    t += 0.05; if (!still) requestAnimationFrame(d); };
  d();
})();
home();
