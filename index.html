<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Osciloscopio Arcade · Medidas Electrónicas I</title>
<style>
:root{
  --bg:#0b1210; --panel:#131d1a; --panel2:#1a2723; --line:#2a3d37;
  --ink:#e6f2ec; --dim:#8fa69c; --trace:#4dff9a; --amber:#ffb84d; --red:#ff6b6b; --blue:#6bc5ff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center}
main{width:100%;max-width:640px;padding:16px 14px 40px}
header{width:100%;max-width:640px;padding:18px 14px 4px;display:flex;align-items:center;gap:12px}
header h1{font-size:19px;margin:0;letter-spacing:.5px;color:var(--trace);text-shadow:0 0 12px rgba(77,255,154,.45)}
header p{margin:2px 0 0;font-size:12px;color:var(--dim)}
.logo{width:44px;height:44px;border:2px solid var(--line);border-radius:10px;background:#07100d;flex:none}
h2{font-size:17px;margin:4px 0 6px;color:var(--amber)}
p{line-height:1.5;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
@media(max-width:420px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;color:var(--ink);font:inherit;cursor:pointer;transition:transform .08s,border-color .15s}
.card:hover,.card:focus-visible{border-color:var(--trace);outline:none}
.card:active{transform:scale(.98)}
.card .t{font-size:15px;font-weight:700;color:var(--trace)}
.card .d{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.45}
.card .b{font-size:12px;color:var(--amber);margin-top:8px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:var(--dim)}
.bar b{color:var(--ink)}
button.btn,a.btn{display:inline-flex;align-items:center;font:inherit;font-size:14px;font-weight:700;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;min-height:46px}
button.btn:hover,button.btn:focus-visible{border-color:var(--trace);outline:none}
button.btn.pri,a.btn.pri{background:var(--trace);color:#06140d;border-color:var(--trace)}
button.btn.ok{border-color:var(--trace);color:var(--trace)}
button.btn.bad{border-color:var(--red);color:var(--red)}
button.btn:disabled{opacity:.55;cursor:default}
.fpwrap{overflow-x:auto;border-radius:14px;-webkit-overflow-scrolling:touch;margin-top:6px}
svg.fp{display:block;width:100%;height:auto}
@media (max-width:620px){svg.fp{min-width:680px}}
svg.fp .lbl{fill:var(--pink);font-family:system-ui,-apple-system,sans-serif;font-weight:700}
svg.fp.quiz .lbl{display:none}
svg.fp .hit{fill:transparent}
svg.fp.explore .ctl{cursor:pointer}
svg.fp.explore .ctl:hover .hit{fill:rgba(77,255,154,.18)}
svg.fp .ring{fill:rgba(255,184,77,.14);stroke:#ff8a00;stroke-width:4;animation:ringp 1.1s ease-in-out infinite}
@keyframes ringp{50%{stroke-width:7;stroke:#ffd166}}
@media (prefers-reduced-motion: reduce){svg.fp .ring{animation:none}}
button.link{background:none;border:none;color:var(--blue);font:inherit;font-size:13px;cursor:pointer;padding:6px 0}
.opts{display:grid;gap:8px;margin-top:12px}
.opts.two{grid-template-columns:1fr 1fr}
.q{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:15px;line-height:1.5;min-height:84px}
.fb{margin-top:10px;font-size:13.5px;line-height:1.5;min-height:42px}
.fb.ok{color:var(--trace)} .fb.bad{color:var(--red)}
canvas{width:100%;display:block;background:#04100b;border:2px solid var(--line);border-radius:10px;touch-action:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.row label{font-size:13px;color:var(--dim)}
input[type=number]{font:inherit;font-size:16px;width:110px;background:#07100d;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px}
input[type=range]{width:100%;accent-color:var(--trace);height:34px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{font:inherit;font-size:13px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:10px 13px;cursor:pointer}
.chip.used{opacity:.25;pointer-events:none}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:44px;margin-top:10px;font-size:13px}
.chain span{background:#0d2a1c;border:1px solid var(--trace);color:var(--trace);border-radius:8px;padding:7px 9px}
.chain i{color:var(--dim);font-style:normal}
.info{background:var(--panel);border-left:3px solid var(--amber);padding:10px 12px;border-radius:6px;font-size:13px;line-height:1.5;margin-top:10px;color:var(--ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;font:inherit;font-size:13px;font-weight:700;background:var(--panel2);color:var(--dim);border:none;padding:11px 8px;cursor:pointer}
.seg button.on{background:var(--trace);color:#06140d}
.big{font-size:40px;color:var(--trace);text-align:center;margin:18px 0 4px;text-shadow:0 0 14px rgba(77,255,154,.4)}
.center{text-align:center}
footer{font-size:11px;color:var(--dim);padding:0 14px 24px;text-align:center;max-width:640px}
</style>
</head>
<body>
<header>
  <canvas class="logo" id="logo" width="88" height="88" aria-hidden="true"></canvas>
  <div><h1>OSCILOSCOPIO ARCADE</h1><p>Medidas Electrónicas I · 2º parcial · minijuegos de repaso</p></div>
</header>
<main id="app"></main>
<footer>Hecho para estudiar osciloscopio analógico y digital, sondas y mediciones. Los puntajes se guardan solo en este dispositivo.</footer>

<script>
"use strict";
/* ---------- utilidades ---------- */
const $ = (s, r=document) => r.querySelector(s);
const app = $("#app");
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let scores = {};
try { scores = JSON.parse(localStorage.getItem("osc-arcade") || "{}") || {}; } catch (e) { scores = {}; }
function saveBest(id, v) {
  if (!(id in scores) || v > scores[id]) { scores[id] = v; try { localStorage.setItem("osc-arcade", JSON.stringify(scores)); } catch (e) {} return true; }
  return false;
}
let timers = [], outs = [];
let raf = 0;
function clearAll() { timers.forEach(clearInterval); timers = []; outs.forEach(clearTimeout); outs = []; cancelAnimationFrame(raf); raf = 0; }
function later(fn, ms) { outs.push(setTimeout(fn, ms)); }
/* ---------- sin repetidos ---------- */
/* mazo: no repite ninguna clave hasta agotar todas; recuerda el avance entre partidas */
function deck(name, keys) {
  const K = "osc-deck-" + name, all = new Set(keys);
  let st = null; try { st = JSON.parse(localStorage.getItem(K) || "null"); } catch (e) {}
  let rest = st && Array.isArray(st.rest) ? st.rest.filter(k => all.has(k)) : null, done = st && Array.isArray(st.done) ? st.done.filter(k => all.has(k)) : [];
  if (!rest) rest = shuffle(keys); else { const known = new Set([...rest, ...done]); rest = rest.concat(shuffle(keys.filter(k => !known.has(k)))); }
  const used = new Set();
  const save = () => { try { localStorage.setItem(K, JSON.stringify({ rest, done })); } catch (e) {} };
  return () => {
    if (!rest.length) { const last = done[done.length - 1]; rest = shuffle(keys.filter(k => !used.has(k))); done = []; if (!rest.length) { used.clear(); rest = shuffle(keys); }
      if (rest.length > 1 && rest[0] === last) rest.push(rest.shift()); }
    const k = rest.shift(); used.add(k); done.push(k); save(); return k;
  };
}
/* generadores aleatorios: no repite una combinación entre las últimas 200 que salieron */
function fresh(name, gen, keyOf) {
  const K = "osc-recent-" + name; let rec = [];
  try { rec = JSON.parse(localStorage.getItem(K) || "[]") || []; } catch (e) {}
  let it, k, n = 0;
  do { it = gen(); k = keyOf(it); n++; } while (rec.includes(k) && n < 200);
  rec.push(k); if (rec.length > 200) rec = rec.slice(-200);
  try { localStorage.setItem(K, JSON.stringify(rec)); } catch (e) {}
  return it;
}
function fmt(v) { return (Math.round(v * 100) / 100).toString().replace(".", ","); }

/* ---------- pantalla de osciloscopio ---------- */
function setupCanvas(cv, ratio = 0.8) {
  const w = cv.clientWidth || 600, dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(w * dpr); cv.height = Math.round(w * ratio * dpr);
  const ctx = cv.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w, h: w * ratio };
}
function drawGrid(ctx, w, h, cols = 10, rows = 8) {
  ctx.clearRect(0, 0, w, h); ctx.fillStyle = "#04100b"; ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = "rgba(120,170,150,.28)"; ctx.lineWidth = 1;
  for (let i = 0; i <= cols; i++) { const x = i * w / cols; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
  for (let j = 0; j <= rows; j++) { const y = j * h / rows; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  ctx.strokeStyle = "rgba(160,210,190,.6)";
  ctx.beginPath(); ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h); ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2); ctx.stroke();
  for (let i = 0; i <= cols * 5; i++) { const x = i * w / (cols * 5); ctx.beginPath(); ctx.moveTo(x, h / 2 - 3); ctx.lineTo(x, h / 2 + 3); ctx.stroke(); }
  for (let j = 0; j <= rows * 5; j++) { const y = j * h / (rows * 5); ctx.beginPath(); ctx.moveTo(w / 2 - 3, y); ctx.lineTo(w / 2 + 3, y); ctx.stroke(); }
}
function trace(ctx, pts, color = "#4dff9a") {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 2.2; ctx.shadowColor = color; ctx.shadowBlur = 8; ctx.lineJoin = "round";
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); ctx.restore();
}

/* ---------- menú ---------- */
const GAMES = [
  { id: "vf", t: "Verdadero o Falso relámpago", d: "60 segundos. Afirmaciones de todo el temario, como las que caen en el parcial.", unit: "aciertos" },
  { id: "frente", t: "Panel frontal", d: "Paneles de un osciloscopio analógico y uno digital: nombrá cada perilla o sección y decí para qué sirve. Con modo explorar para estudiar.", unit: "" },
  { id: "panel", t: "¿Qué perilla es?", d: "Te doy la función, elegí el control del panel frontal.", unit: "/10" },
  { id: "medir", t: "Medí la señal", d: "Leé la retícula: calculá Vpp y frecuencia con las escalas y la sonda.", unit: "/10" },
  { id: "sonda", t: "Compensá la sonda", d: "Resolvé el ejercicio de compensación y mirá en el osciloscopio si la cuadrada del borne CAL quedó perfecta.", unit: "pts" },
  { id: "trigger", t: "Cazá el disparo", d: "LEVEL, SLOPE y MODE: cumplí cada misión de disparo.", unit: "/6" },
  { id: "liss", t: "Lissajous", d: "Modo XY: adiviná el desfasaje o la relación de frecuencias.", unit: "/8" },
  { id: "bloques", t: "Armá el osciloscopio", d: "Ordená los bloques de cada cadena de señal.", unit: "pts" },
  { id: "alias", t: "Cazador de aliasing", d: "Osciloscopio digital: ¿se cumple Nyquist? ¿Qué frecuencia falsa aparece?", unit: "/8" }
];
function home() {
  clearAll();
  app.innerHTML = `<p>Elegí un minijuego. Cada uno repasa una parte del temario del Ing. Teruel: osciloscopio analógico, disparo, sonda, mediciones y osciloscopio digital.</p>
  <div class="grid">${GAMES.map(g => `<button class="card" data-g="${g.id}"><div class="t">${g.t}</div><div class="d">${g.d}</div><div class="b">${g.id === "frente" ? (["analog", "digital"].map(k => ("frente-" + k) in scores ? (k === "analog" ? "Analógico " : "Digital ") + scores["frente-" + k] + "/16" : "").filter(Boolean).join(" · ") || "Sin jugar") : g.id in scores ? "Récord: " + scores[g.id] + " " + g.unit : "Sin jugar"}</div></button>`).join("")}</div>
  <div class="row" style="justify-content:center;margin-top:14px"><a class="btn pri" href="Guia_Estudio_Medidas.pdf" target="_blank" rel="noopener" style="text-decoration:none">📄 Abrir la guía de estudio (PDF)</a></div>`;
  app.querySelectorAll(".card").forEach(b => b.onclick = () => START[b.dataset.g]());
  window.scrollTo(0, 0);
}
function shell(title, inner) {
  clearAll();
  app.innerHTML = `<button class="link" id="back">← Volver al menú</button><h2>${title}</h2>${inner}`;
  $("#back").onclick = home; window.scrollTo(0, 0);
}
function finish(id, score, unit, msg) {
  clearAll();
  const best = saveBest(id, score);
  app.innerHTML = `<button class="link" id="back">← Volver al menú</button><div class="big">${score} ${unit}</div>
  <p class="center">${best ? "¡Nuevo récord!" : "Récord: " + scores[id] + " " + unit}</p><p class="center">${msg || ""}</p>
  <div class="row" style="justify-content:center"><button class="btn pri" id="again">Jugar de nuevo</button><button class="btn" id="menu">Menú</button></div>`;
  $("#back").onclick = home; $("#menu").onclick = home; $("#again").onclick = () => START[id]();
}
const START = {};

/* ---------- 1. Verdadero o falso ---------- */
const VF = [
  ["Al pasar TIME/DIV de 0,2 ms/div a 1 ms/div entran más ciclos en la pantalla.", true, "La rampa es más suave: la pantalla abarca más tiempo."],
  ["TIME/DIV cambia la pendiente de la rampa del generador de barrido.", true, "Cambia el capacitor (y la corriente) del generador."],
  ["Una senoidal serviría igual que el diente de sierra como base de tiempo.", false, "No es lineal y su vuelta sería tan lenta como la ida."],
  ["La rampa se genera cargando un capacitor con corriente constante.", true, "V = I·t/C: una recta."],
  ["Se ve una línea continua gracias a la persistencia del fósforo y de la retina.", true, "El haz es un solo punto que barre muchas veces por segundo."],
  ["La luz UNCAL indica que VAR no está en la posición calibrada.", true, "Las mediciones por divisiones serían incorrectas."],
  ["Una señal de 4 Vpp en 2 V/div ocupa 4 divisiones.", false, "Ocupa 2 divisiones: 4 V / 2 V/div."],
  ["En un osciloscopio digital, una base de tiempo más lenta baja la frecuencia de muestreo.", true, "fs = puntos / (10 × TIME/DIV)."],
  ["Con 2500 puntos y 1 µs/div, la frecuencia de muestreo es 250 MS/s.", true, "2500 / 10 µs = 250 MS/s."],
  ["Con 8 bits el conversor A/D tiene 1024 niveles.", false, "Tiene 2⁸ = 256 niveles."],
  ["La base de tiempo del osciloscopio analógico es una señal diente de sierra.", true, "La rampa lineal mueve el haz a velocidad constante."],
  ["Durante el retrazo el haz permanece encendido.", false, "El eje Z lo apaga para que no se vea la vuelta."],
  ["La rejilla de control del TRC regula el brillo (INTENSITY).", true, "Controla cuántos electrones pasan."],
  ["El cátodo emite electrones por efecto termoiónico.", true, "Un filamento lo calienta."],
  ["La línea de retardo está en el canal horizontal.", false, "Está en el canal vertical: atrasa la señal para ver el flanco de disparo."],
  ["Sin línea de retardo no se vería el flanco que disparó el barrido.", true, "El disparo tarda en arrancar la rampa."],
  ["En acoplamiento AC se bloquea la componente continua.", true, "Un capacitor en serie la elimina."],
  ["El acoplamiento AC se comporta como un filtro pasa bajos.", false, "Es un pasa altos: atenúa las bajas frecuencias."],
  ["En GND se ve la referencia de 0 V.", true, "La entrada del amplificador se pone a masa."],
  ["El modo CHOP conviene para señales de baja frecuencia.", true, "Con ALT la imagen parpadearía."],
  ["En modo ALT se conmuta entre canales muchas veces dentro de un mismo barrido.", false, "Eso es CHOP. ALT usa un barrido completo por canal."],
  ["El ancho de banda lo define principalmente el amplificador vertical.", true, "Es la frecuencia donde la respuesta cae 3 dB."],
  ["En el límite del ancho de banda el error de amplitud es de alrededor del 30 %.", true, "−3 dB equivale a 70,7 % de la amplitud."],
  ["Para medir con la retícula el control VAR debe estar en CAL.", true, "Si no, la escala está descalibrada."],
  ["La rampa se obtiene cargando un capacitor con corriente constante.", true, "V = I·t / C."],
  ["En modo NORMAL, si no hay disparo, igual se ve una traza.", false, "En NORMAL sin disparo no hay barrido. Eso lo hace AUTO."],
  ["En modo AUTO, sin disparo, el barrido corre libre.", true, "Un temporizador interno lo lanza."],
  ["El hold-off sirve para estabilizar trenes de pulsos.", true, "Ignora disparos durante un tiempo tras cada barrido."],
  ["La fuente LINE dispara con la tensión de red.", true, "50 Hz."],
  ["El disparo fija el nivel y la pendiente donde arranca cada barrido.", true, "Por eso la imagen queda quieta."],
  ["El Schmitt trigger convierte la señal de disparo en una cuadrada.", true, "Luego se deriva para obtener los pulsos."],
  ["La entrada típica del osciloscopio es 1 MΩ en paralelo con unos 20 pF.", true, "Es lo que fija el atenuador."],
  ["La sonda 1X atenúa la señal 10 veces.", false, "La 1X no atenúa. La 10X sí."],
  ["La sonda 10X presenta 10 MΩ al circuito.", true, "9 MΩ de la sonda + 1 MΩ del osciloscopio."],
  ["La condición de compensación es Rp·Cp = Ro·(Co + Cc).", true, "Iguales constantes de tiempo."],
  ["Una sonda subcompensada muestra picos en los flancos.", false, "Muestra flancos redondeados. Los picos son de la sobrecompensada."],

  ["La impedancia de entrada del osciloscopio sube con la frecuencia.", false, "Baja, porque Xc = 1/ωC disminuye."],
  ["Un osciloscopio de 100 MHz tiene un tiempo de subida de 3,5 ns.", true, "Tr = 0,35 / BW."],
  ["Un cable de masa largo en la sonda puede producir ringing.", true, "Agrega inductancia que resuena."],
  ["La sonda activa tiene un FET en la punta y muy baja capacidad.", true, "1 a 3 pF."],
  ["El método XY indica cuál de las dos señales adelanta.", false, "Da el módulo del desfasaje, no el signo."],
  ["Una recta a 45° en modo XY indica desfasaje de 0°.", true, "Ambas señales en fase."],
  ["Un círculo en XY (escalas iguales) indica 90°.", true, "Señales en cuadratura."],
  ["El osciloscopio mide corriente directamente.", false, "Solo mide tensión: se usa shunt o sonda de corriente."],
  ["La sonda de corriente de AC funciona como un transformador.", true, "El conductor es el primario."],
  ["Para medir corriente continua con sonda se usa efecto Hall.", true, "La de transformador no mide DC."],
  ["La pinza de masa de la sonda está unida a la tierra de la red.", true, "Por eso hay que cuidar dónde se conecta."],
  ["El osciloscopio digital muestrea la señal con un conversor A/D.", true, "Luego la guarda en memoria."],
  ["Con fs < 2f aparece aliasing.", true, "Se ve una señal falsa de frecuencia fs − f."],
  ["Un A/D de 8 bits tiene 256 niveles.", true, "2⁸ = 256."],
  ["El muestreo en tiempo equivalente sirve para transitorios únicos.", false, "Solo para señales repetitivas. Los transitorios requieren tiempo real."],
  ["El modo detección de picos capta glitches angostos.", true, "Guarda el máximo y el mínimo de cada intervalo."],
  ["El modo promedio reduce el ruido aleatorio.", true, "Solo sirve con señales repetitivas."],
  ["El predisparo existe en el osciloscopio analógico.", false, "Solo en el digital, por la memoria circular."],
  ["En el digital, cambiar SEC/DIV cambia la frecuencia de muestreo.", true, "Con escalas lentas puede aparecer aliasing."],
  ["El digital necesita ALT o CHOP para ver dos canales.", false, "Adquiere los canales en simultáneo."],
  ["El conversor flash es el más rápido.", true, "Es de tipo paralelo."],
  ["La interpolación senoidal (sin x / x) conviene para pulsos rectangulares.", false, "Para pulsos conviene la lineal."],
  ["Las mediciones automáticas del digital son más precisas que contar divisiones.", true, "Usan los puntos almacenados."],
  ["La base de tiempo demorada permite ampliar una parte de la señal.", true, "Una segunda rampa más rápida arranca tras un retardo."],
  ["MAG ×10 mejora la exactitud de la base de tiempo.", false, "Amplía, pero con menor exactitud."],
  ["ADD con INV en un canal da la diferencia CH1 − CH2.", true, "Sirve para medir en forma diferencial."],
  ["La retícula típica tiene 8 divisiones verticales y 10 horizontales.", true, "Con 5 subdivisiones por división."]
];
START.vf = function () {
  const draw = deck("vf", VF.map(v => v[0])), byQ = new Map(VF.map(v => [v[0], v]));
  let it = null, score = 0, left = 60, lock = false;
  shell("Verdadero o Falso relámpago", `<div class="bar"><span>Tiempo: <b id="tm">60</b> s</span><span>Aciertos: <b id="sc">0</b></span></div>
    <div class="q" id="q"></div><div class="opts two"><button class="btn" id="bv">VERDADERO</button><button class="btn" id="bf">FALSO</button></div><div class="fb" id="fb"></div>`);
  const show = () => { it = byQ.get(draw()); $("#q").textContent = it[0]; };
  const ans = v => {
    if (lock) return; const q = it, ok = v === q[1];
    if (ok) { score++; $("#sc").textContent = score; $("#fb").className = "fb ok"; $("#fb").textContent = "✔ Bien la anterior: " + q[2]; show(); }
    else { lock = true; $("#fb").className = "fb bad"; $("#fb").textContent = "✘ " + (q[1] ? "Era verdadero. " : "Era falso. ") + q[2]; later(() => { lock = false; if (left > 0) show(); }, 1700); }
  };
  $("#bv").onclick = () => ans(true); $("#bf").onclick = () => ans(false); show();
  timers.push(setInterval(() => { left--; const t = $("#tm"); if (t) t.textContent = left; if (left <= 0) finish("vf", score, "aciertos", score >= 20 ? "Excelente ritmo." : "Repasá las que fallaste y volvé a intentar."); }, 1000));
};

START.panel = function () {
  const draw = deck("panel", PANEL.map(p => p[0])), byK = new Map(PANEL.map(p => [p[0], p]));
  const list = Array.from({ length: Math.min(10, PANEL.length) }, () => byK.get(draw())); let i = 0, score = 0;
  shell("¿Qué perilla es?", `<div class="bar"><span>Pregunta <b id="n">1</b>/10</span><span>Aciertos: <b id="sc">0</b></span></div><div class="q" id="q"></div><div class="opts" id="o"></div><div class="fb" id="fb"></div>`);

    const others = shuffle(PANEL.filter(p => p[0] !== it[0])).slice(0, 3).map(p => p[0]);

      later(() => { i++; i < 10 ? show() : finish("panel", score, "/10", score >= 8 ? "Conocés el panel de memoria." : "Mirá la tabla del panel frontal en la guía."); }, 1100);

/* ---------- 3. Medí la señal ---------- */
START.medir = function () {
  let round = 0, score = 0, cur = null;
  shell("Medí la señal", `<div class="bar"><span>Señal <b id="n">1</b>/5</span><span>Puntos: <b id="sc">0</b>/10</span></div><canvas id="cv"></canvas>
    <div class="info" id="set"></div>
    <div class="row"><label for="vpp">Vpp real [V]</label><input type="number" id="vpp" step="any" inputmode="decimal"></div>
    <div class="row"><label for="fr">Frecuencia [Hz]</label><input type="number" id="fr" step="any" inputmode="decimal"></div>
    <div class="row"><button class="btn pri" id="go">Comprobar</button></div><div class="fb" id="fb"></div>`);
  const cv = $("#cv");
  const tdivs = [[0.1e-3, "0,1 ms"], [0.2e-3, "0,2 ms"], [0.5e-3, "0,5 ms"], [1e-3, "1 ms"], [2e-3, "2 ms"], [5e-3, "5 ms"]];
  const next = () => {
    cur = fresh("medir", () => {
      const vd = pick([0.1, 0.2, 0.5, 1, 2, 5]), td = pick(tdivs), probe = pick([1, 1, 10]);
      const ppDiv = pick([2, 2.4, 3, 3.6, 4, 4.4, 5, 5.6, 6]), perDiv = pick([2, 2.5, 3, 4, 5]);
      return { vpp: ppDiv * vd * probe, f: 1 / (perDiv * td[0]), ppDiv, perDiv, vd, td, probe };
    }, c => [c.vd, c.td[1], c.probe, c.ppDiv, c.perDiv].join("|"));
    const { vd, td, probe, ppDiv, perDiv } = cur;
    $("#n").textContent = round + 1; $("#vpp").value = ""; $("#fr").value = ""; $("#fb").textContent = ""; $("#go").textContent = "Comprobar"; $("#go").onclick = check;
    $("#set").innerHTML = `VOLTS/DIV: <b>${fmt(vd)} V</b> · TIME/DIV: <b>${td[1]}</b> · Sonda: <b>${probe}X</b> (el osciloscopio no la detecta) · VAR en CAL`;
    const { ctx, w, h } = setupCanvas(cv); drawGrid(ctx, w, h);
    const pts = []; const ph = rnd(0, 6.28);
    for (let x = 0; x <= w; x += 2) pts.push([x, h / 2 - (ppDiv / 2) * (h / 8) * Math.sin(2 * Math.PI * (x / (w / 10)) / perDiv + ph)]);
    trace(ctx, pts);
  };
  const check = () => {
    const v = parseFloat($("#vpp").value), f = parseFloat($("#fr").value);
    const okV = Math.abs(v - cur.vpp) / cur.vpp < 0.07, okF = Math.abs(f - cur.f) / cur.f < 0.07;
    score += (okV ? 1 : 0) + (okF ? 1 : 0); $("#sc").textContent = score;
    $("#fb").className = "fb " + (okV && okF ? "ok" : "bad");
    $("#fb").innerHTML = `${okV ? "✔" : "✘"} Vpp = ${fmt(cur.ppDiv)} div × ${fmt(cur.vd)} V/div × ${cur.probe} = <b>${fmt(cur.vpp)} V</b><br>${okF ? "✔" : "✘"} T = ${fmt(cur.perDiv)} div × ${cur.td[1]}/div → f = <b>${fmt(cur.f)} Hz</b>`;
    round++; $("#go").textContent = round < 5 ? "Siguiente señal" : "Ver resultado";
    $("#go").onclick = () => round < 5 ? next() : finish("medir", score, "/10", "Recordá: divisiones × escala × factor de sonda.");
  };
  next();
};

/* ---------- 4. Compensá la sonda ---------- */
START.sonda = function () {
  const N = 5;
  let round = 0, total = 0, cur = null, done = false, hint = false;
  shell("Compensá la sonda", `<div class="bar"><span>Ejercicio <b id="n">1</b>/${N}</span><span>Puntos: <b id="sc">0</b></span></div>
    <div class="info" id="set"></div>
    <div class="row"><label for="ans" id="lab"></label></div>
    <div class="row"><input id="ans" type="text" inputmode="decimal" autocomplete="off" placeholder="tu resultado" style="flex:1;min-width:0;font:inherit;font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink)"><span id="un" style="align-self:center;font-weight:700"></span></div>
    <div class="row"><button class="btn pri" id="go">Probar en el osciloscopio</button><button class="btn" id="hint">Pista (−50 %)</button></div>
    <canvas id="cv"></canvas><div class="center" id="st" style="min-height:22px;font-weight:700;margin:6px 0"></div>
    <div class="fb" id="fb"></div>`);
  const cv = $("#cv"), inp = $("#ans");

  /* forma de onda del borne CAL vista con la sonda: a = división en alta frec. / división en baja frec. */
  const ratio = (cp, ct, k) => (cp / (cp + ct)) * (k + 1);   // k = Rp/Ro
  const wave = (w, h, a) => {
    a = Math.max(0.25, Math.min(2.1, a));
    const half = w / 4, amp = h * 0.18, tau = half * 0.17, pts = [];
    for (let x = 0; x <= w; x++) { const k = Math.floor(x / half), t = x - k * half, s = k % 2 === 0 ? 1 : -1; pts.push([x, h / 2 - amp * s * (1 + (a - 1) * Math.exp(-t / tau))]); }
    return pts;
  };
  const screen = () => { const o = setupCanvas(cv, 0.55); drawGrid(o.ctx, o.w, o.h, 10, 6); return o; };
  const label = (ctx, txt, col) => { ctx.save(); ctx.font = "bold 12px ui-monospace,monospace"; ctx.fillStyle = col; ctx.fillText(txt, 8, 16); ctx.restore(); };
  const idle = () => { const { ctx } = screen(); label(ctx, "CAL 1 kHz · esperando tu Cp…", "rgba(160,210,190,.8)"); };

  /* barrido: el haz dibuja la señal de izquierda a derecha */
  const sweep = (a, txt, col, ghost, cb) => {
    const t0 = performance.now(), dur = 1300;
    const step = now => {
      const { ctx, w, h } = screen(); const p = Math.min(1, (now - t0) / dur), pts = wave(w, h, a), n = Math.max(2, Math.floor(p * pts.length));
      if (ghost) trace(ctx, wave(w, h, ghost), "rgba(77,255,154,.22)");
      trace(ctx, pts.slice(0, n), col); label(ctx, txt, col);
      const head = pts[n - 1]; ctx.save(); ctx.fillStyle = "#eafff2"; ctx.shadowColor = col; ctx.shadowBlur = 14; ctx.beginPath(); ctx.arc(head[0], head[1], 3.2, 0, 7); ctx.fill(); ctx.restore();
      if (p < 1) raf = requestAnimationFrame(step); else { const o = screen(); if (ghost) trace(o.ctx, wave(o.w, o.h, ghost), "rgba(77,255,154,.22)"); trace(o.ctx, pts, col); label(o.ctx, txt, col); cb && cb(); }
    };
    raf = requestAnimationFrame(step);
  };
  /* el trimmer gira del valor del alumno al correcto y la forma se corrige */
  const morph = (cpFrom, cpTo, ct, k, ghostA, cb) => {
    const t0 = performance.now(), dur = 1800;
    const step = now => {
      const p = Math.min(1, (now - t0) / dur), e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2, cp = cpFrom + (cpTo - cpFrom) * e;
      const { ctx, w, h } = screen(); trace(ctx, wave(w, h, ghostA), "rgba(255,120,120,.25)");
      trace(ctx, wave(w, h, ratio(cp, ct, k))); label(ctx, `Girando Cp… ${fmt(cp)} pF`, "#4dff9a");
      if (p < 1) raf = requestAnimationFrame(step); else cb && cb();
    };
    raf = requestAnimationFrame(step);
  };

  const GEN = [
    () => { const co = pick([15, 20, 25, 30]), cc = pick([60, 70, 80, 90, 100, 110]);
      return { txt: `Sonda <b>10X</b> (Rp = 9 MΩ) en un osciloscopio con Ro = 1 MΩ y <b>Co = ${co} pF</b>. El cable tiene <b>Cc = ${cc} pF</b>. ¿Qué valor tiene que tener Cp para que la sonda quede compensada?`,
        lab: "Cp =", un: "pF", ans: (co + cc) / 9, k: 9, sim: v => [v, co + cc],
        sol: `Rp·Cp = Ro·(Co + Cc) ⇒ Cp = Ro·(Co + Cc)/Rp = (${co} + ${cc}) pF / 9 = <b>${fmt((co + cc) / 9)} pF</b>` }; },
    () => { const co = pick([10, 12, 15, 20]), cc = pick([80, 90, 100, 120, 140]);
      return { txt: `Sonda <b>100X</b> en un osciloscopio con Ro = 1 MΩ, <b>Co = ${co} pF</b>; cable de <b>Cc = ${cc} pF</b>. ¿Cuánto vale Cp? (Primero deducí Rp a partir de la atenuación.)`,
        lab: "Cp =", un: "pF", ans: (co + cc) / 99, k: 99, sim: v => [v, co + cc],
        sol: `100X ⇒ Ro/(Rp + Ro) = 1/100 ⇒ Rp = 99 MΩ. Cp = (Co + Cc)/99 = ${co + cc} pF / 99 = <b>${fmt((co + cc) / 99)} pF</b>` }; },
    () => { const c1 = pick([15, 20]), c2 = pick([25, 30, 35]), cc = pick([70, 80, 90, 100]);
      return { txt: `Una sonda 10X (Rp = 9 MΩ) con cable de <b>Cc = ${cc} pF</b> estaba compensada en un osciloscopio con Co = ${c1} pF. La pasás a otro osciloscopio con Ro = 1 MΩ y <b>Co = ${c2} pF</b>. ¿A qué valor hay que llevar Cp?`,
        lab: "Cp nuevo =", un: "pF", ans: (c2 + cc) / 9, k: 9, sim: v => [v, c2 + cc],
        sol: `Solo importa el osciloscopio nuevo: Cp = (Co + Cc)/9 = (${c2} + ${cc}) pF / 9 = <b>${fmt((c2 + cc) / 9)} pF</b> (antes era ${fmt((c1 + cc) / 9)} pF: por eso hay que compensar cada vez que cambiás de equipo).` }; },
    () => { const cpm = pick([10, 12, 14, 15]), co = pick([15, 20, 25]);
      return { txt: `El trimmer de una sonda 10X (Rp = 9 MΩ) llega como máximo a <b>Cp = ${cpm} pF</b>. El osciloscopio tiene Ro = 1 MΩ y <b>Co = ${co} pF</b>. ¿Cuál es la capacidad de cable Cc más grande que todavía se puede compensar?`,
        lab: "Cc máx =", un: "pF", ans: 9 * cpm - co, k: 9, sim: v => [cpm, co + v],
        sol: `9·Cp = Co + Cc ⇒ Cc = 9·${cpm} − ${co} = <b>${fmt(9 * cpm - co)} pF</b>. Con un cable de más capacidad, la sonda queda subcompensada aunque el trimmer esté al máximo.` }; },
    () => { const cp = pick([10, 11, 12]), cc = pick([70, 75, 80]);
      return { txt: `Una sonda 10X (Rp = 9 MΩ) con el trimmer fijo en <b>Cp = ${cp} pF</b> y cable de <b>Cc = ${cc} pF</b>. ¿Qué capacidad de entrada Co debería tener el osciloscopio (Ro = 1 MΩ) para que quede compensada?`,
        lab: "Co =", un: "pF", ans: 9 * cp - cc, k: 9, sim: v => [cp, v + cc],
        sol: `Co = 9·Cp − Cc = 9·${cp} − ${cc} = <b>${fmt(9 * cp - cc)} pF</b>` }; },
  ];
  let order = [];
  const next = () => {
    if (!order.length) order = shuffle(GEN.map((_, i) => i));
    const g = GEN[order.pop()]; cur = fresh("sonda", g, c => c.txt); done = false; hint = false; cancelAnimationFrame(raf);
    $("#n").textContent = round + 1; $("#set").innerHTML = cur.txt; $("#lab").textContent = cur.lab; $("#un").textContent = cur.un;
    inp.value = ""; inp.disabled = false; $("#fb").textContent = ""; $("#fb").className = "fb"; $("#st").textContent = "";
    $("#hint").disabled = false; $("#hint").style.display = ""; $("#go").disabled = false; $("#go").textContent = "Probar en el osciloscopio"; $("#go").onclick = check; idle();
  };
  $("#hint").onclick = () => { if (done || hint) return; hint = true; $("#hint").disabled = true;
    $("#fb").className = "fb"; $("#fb").innerHTML = "Pista: la sonda queda compensada cuando las dos constantes de tiempo son iguales, <b>Rp·Cp = Ro·(Co + Cc)</b>. Con Rp = 9 Ro queda 9·Cp = Co + Cc."; };
  const check = () => {
    if (done) return;
    const v = parseFloat(inp.value.replace(",", "."));
    if (!isFinite(v) || v <= 0) { $("#fb").className = "fb bad"; $("#fb").textContent = "Escribí un número positivo (en pF)."; return; }
    done = true; inp.disabled = true; inp.blur(); $("#hint").style.display = "none"; $("#go").onclick = null; $("#go").disabled = true; $("#go").textContent = "Midiendo…";
    cv.scrollIntoView({ block: "center", behavior: "smooth" });
    const err = Math.abs(v - cur.ans) / cur.ans;
    let pts = err <= 0.03 ? 100 : err <= 0.08 ? 60 : err <= 0.15 ? 30 : 0; if (hint) pts = Math.round(pts / 2);
    const [cpU, ctU] = cur.sim(v), aU = ratio(cpU, ctU, cur.k), ok = Math.abs(aU - 1) <= 0.03;
    const name = ok ? "COMPENSADA" : aU < 1 ? "SUBCOMPENSADA" : "SOBRECOMPENSADA", col = ok ? "#4dff9a" : aU < 1 ? "#ffd166" : "#ff6b6b";
    $("#st").textContent = "Midiendo…"; $("#st").style.color = "";
    sweep(aU, `Con tu valor: ${fmt(v)} ${cur.un}`, col, null, () => {
      total += pts; $("#sc").textContent = total;
      $("#st").textContent = name; $("#st").style.color = col;
      const why = ok ? "La cuadrada sale perfecta: el divisor capacitivo divide igual que el resistivo."
        : aU < 1 ? "Flancos redondeados: el divisor capacitivo atenúa de más las altas frecuencias." : "Picos en los flancos: el divisor capacitivo deja pasar de más las altas frecuencias.";
      $("#fb").className = "fb " + (pts >= 60 ? "ok" : "bad");
      $("#fb").innerHTML = `${why}<br>${cur.sol}<br>+${pts} puntos${hint ? " (con pista)" : ""}.`;
      const end = () => { round++; $("#go").disabled = false; $("#go").textContent = round < N ? "Siguiente ejercicio" : "Ver resultado";
        $("#go").onclick = () => round < N ? next() : finish("sonda", total, "pts", "Rp·Cp = Ro·(Co + Cc). Sub: redondeada. Sobre: picos. Perfecta: cuadrada."); };
      if (ok) end();
      else later(() => { const [cpOk, ctOk] = cur.sim(cur.ans);
        // Cp equivalente que produce la misma forma que el valor del alumno (si el error estaba en Cc o Co, se ve como un ajuste de Cp)
        const cpFrom = aU * ctOk / ((cur.k + 1) - aU);
        morph(cpFrom, cpOk, ctOk, cur.k, aU, () => {
          const o = screen(); trace(o.ctx, wave(o.w, o.h, 1)); label(o.ctx, `Valor correcto: ${fmt(cur.ans)} ${cur.un}`, "#4dff9a"); end(); }); }, 900);
    });
  };
  inp.onkeydown = e => { if (e.key === "Enter") ($("#go").onclick || (() => {}))(); };
  next();
};

/* ---------- 5. Cazá el disparo ---------- */
START.trigger = function () {
  const A = 3; // amplitud en divisiones (pico)
  const MIS = [
    ["Dejá la imagen quieta, con el barrido arrancando en un flanco ascendente.", s => s.inside && s.slope > 0, "Con el nivel dentro de la señal y SLOPE +, cada barrido empieza en el mismo punto."],
    ["Ahora que el barrido arranque en un flanco descendente.", s => s.inside && s.slope < 0, "SLOPE − dispara cuando la señal cruza el nivel bajando."],
    ["Hacé que la pantalla quede en negro (sin traza).", s => !s.inside && s.mode === "N", "NORMAL con el nivel fuera de la señal: no hay disparo, no hay barrido."],
    ["Lográ un barrido libre: que la señal se vea corriendo, sin sincronizar.", s => !s.inside && s.mode === "A", "AUTO sin disparo: un temporizador lanza barridos que arrancan en cualquier punto."],
    ["Que el barrido arranque cerca del pico positivo, subiendo (nivel entre +2,4 y +3 div).", s => s.inside && s.slope > 0 && s.level >= 2.4, "El LEVEL elige la tensión del punto de arranque."],
    ["Que arranque cerca del pico negativo, bajando (nivel entre −3 y −2,4 div), en modo NORMAL.", s => s.inside && s.slope < 0 && s.level <= -2.4 && s.mode === "N", "Nivel, pendiente y modo actúan juntos."]
  ];
  let m = 0, score = 0, st = { level: 4, slope: 1, mode: "A" }, phase = 0;
  shell("Cazá el disparo", `<div class="bar"><span>Misión <b id="n">1</b>/${MIS.length}</span><span>Logradas: <b id="sc">0</b></span></div><div class="q" id="q"></div><div style="height:10px"></div><canvas id="cv"></canvas>
    <div class="row"><label for="lv">TRIG LEVEL: <b id="lvv"></b> div</label></div><input type="range" id="lv" min="-4" max="4" step="0.1" value="4">
    <div class="row" style="gap:10px"><div class="seg" style="flex:1"><button id="sp">SLOPE +</button><button id="sm">SLOPE −</button></div><div class="seg" style="flex:1"><button id="ma">AUTO</button><button id="mn">NORMAL</button></div></div>
    <div class="row"><button class="btn pri" id="go">Comprobar</button></div><div class="fb" id="fb"></div>`);
  const cv = $("#cv"); let dims = setupCanvas(cv, 0.8);
  const sync = () => { $("#sp").className = st.slope > 0 ? "on" : ""; $("#sm").className = st.slope < 0 ? "on" : ""; $("#ma").className = st.mode === "A" ? "on" : ""; $("#mn").className = st.mode === "N" ? "on" : ""; $("#lvv").textContent = (st.level > 0 ? "+" : "") + fmt(st.level); st.inside = Math.abs(st.level) <= A; };
  $("#lv").oninput = e => { st.level = parseFloat(e.target.value); sync(); };
  $("#sp").onclick = () => { st.slope = 1; sync(); }; $("#sm").onclick = () => { st.slope = -1; sync(); };
  $("#ma").onclick = () => { st.mode = "A"; sync(); }; $("#mn").onclick = () => { st.mode = "N"; sync(); };
  const frame = () => {
    const { ctx, w, h } = dims; drawGrid(ctx, w, h); const dv = h / 8, per = w / 3.2;
    const yl = h / 2 - st.level * dv; ctx.save(); ctx.strokeStyle = "#ffb84d"; ctx.setLineDash([6, 5]); ctx.beginPath(); ctx.moveTo(0, yl); ctx.lineTo(w, yl); ctx.stroke(); ctx.restore();
    ctx.fillStyle = "#ffb84d"; ctx.font = "11px monospace"; ctx.fillText("LEVEL", 6, Math.max(12, Math.min(h - 4, yl - 4)));
    let ph0 = null;
    if (st.inside) { const a = Math.asin(st.level / A); ph0 = st.slope > 0 ? a : Math.PI - a; }
    else if (st.mode === "A") { phase += 0.21; ph0 = phase; }
    if (ph0 !== null) { const pts = []; for (let x = 0; x <= w; x += 2) pts.push([x, h / 2 - A * dv * Math.sin(2 * Math.PI * x / per + ph0)]); trace(ctx, pts); }
    else { ctx.fillStyle = "rgba(143,166,156,.7)"; ctx.font = "13px monospace"; ctx.textAlign = "center"; ctx.fillText("sin disparo · sin barrido", w / 2, h / 2 - 10); ctx.textAlign = "left"; }
    raf = requestAnimationFrame(frame);
  };
  const show = () => { $("#n").textContent = m + 1; $("#q").textContent = MIS[m][0]; $("#fb").textContent = ""; $("#go").textContent = "Comprobar"; $("#go").onclick = check; };
  const check = () => {
    const ok = MIS[m][1](st); if (ok) { score++; $("#sc").textContent = score; }
    $("#fb").className = "fb " + (ok ? "ok" : "bad"); $("#fb").textContent = (ok ? "✔ Misión cumplida. " : "✘ No era eso. ") + MIS[m][2];
    m++; $("#go").textContent = m < MIS.length ? "Siguiente misión" : "Ver resultado";

/* ---------- 6. Lissajous ---------- */
START.liss = function () {
  let round = 0, score = 0;
  const PH = [0, 30, 45, 90, 135, 150, 180], RA = [[1, 2], [2, 1], [1, 3], [3, 1], [2, 3], [3, 2]];
  const drawPh = deck("liss-fase", PH.map(String)), drawRa = deck("liss-rel", RA.map(r => r.join(":")));
  shell("Lissajous", `<div class="bar"><span>Figura <b id="n">1</b>/8</span><span>Aciertos: <b id="sc">0</b></span></div><canvas id="cv"></canvas><div class="q" id="q" style="min-height:0;margin-top:10px"></div><div class="opts two" id="o"></div><div class="fb" id="fb"></div>`);
  const cv = $("#cv");
  const next = () => {
    $("#n").textContent = round + 1; $("#fb").textContent = "";
    const isPhase = round % 2 === 0; let fx = 1, fy = 1, ph = 0, ans, opts, why;
    if (isPhase) { const p = Number(drawPh()); ph = p * Math.PI / 180; ans = p + "°"; opts = shuffle(["0°", "30°", "45°", "90°", "135°", "150°", "180°"].filter(o => o !== ans)).slice(0, 3).concat(ans);
      why = p === 0 ? "Recta a 45°: en fase." : p === 180 ? "Recta inclinada al otro lado: 180°." : p === 90 ? "Círculo: 90°." : (p < 90 ? "Eje mayor en 1.º y 3.º cuadrante: φ = arcsen(B/A)." : "Eje mayor en 2.º y 4.º cuadrante: φ = 180° − arcsen(B/A).");
      $("#q").textContent = "Dos senoidales de igual frecuencia y amplitud en modo XY. ¿Cuál es el desfasaje?"; }
    else { const r = drawRa().split(":").map(Number); fx = r[0]; fy = r[1]; ph = Math.PI / 2; ans = `fy/fx = ${fy}:${fx}`;
      opts = shuffle([[1, 2], [2, 1], [1, 3], [3, 1], [2, 3], [3, 2]].map(x => `fy/fx = ${x[1]}:${x[0]}`).filter(o => o !== ans)).slice(0, 3).concat(ans);
      why = `Tangencias con una recta horizontal: ${fy}. Con una vertical: ${fx}. fy/fx = tangencias horizontales / verticales.`;
      $("#q").textContent = "CH1 en X y CH2 en Y. ¿Cuál es la relación de frecuencias?"; }
    const { ctx, w, h } = setupCanvas(cv, 0.8); drawGrid(ctx, w, h);
    const R = h * 0.36, pts = []; for (let t = 0; t <= 2 * Math.PI + 0.01; t += 0.01) pts.push([w / 2 + R * Math.sin(fx * t), h / 2 - R * Math.sin(fy * t + ph)]);
    trace(ctx, pts);
    $("#o").innerHTML = shuffle(opts).map(o => `<button class="btn" data-o="${o}">${o}</button>`).join("");
    $("#o").querySelectorAll("button").forEach(b => b.onclick = () => {
      $("#o").querySelectorAll("button").forEach(x => { x.disabled = true; if (x.dataset.o === ans) x.classList.add("ok"); });
      const ok = b.dataset.o === ans; if (ok) { score++; $("#sc").textContent = score; } else b.classList.add("bad");
      $("#fb").className = "fb " + (ok ? "ok" : "bad"); $("#fb").textContent = (ok ? "✔ " : "✘ ") + why;
      later(() => { round++; round < 8 ? next() : finish("liss", score, "/8", "El método XY da el módulo del desfasaje, no el signo."); }, 2300);
    });
  };
  next();
};

/* ---------- 8. Aliasing ---------- */
START.alias = function () {
  let round = 0, score = 0;
  const FS = [10, 20, 40, 50, 100], KS = [0.6, 0.8, 1.25, 1.5, 2.5, 4, 5, 10];
  const drawCase = deck("alias-caso", FS.flatMap(f => KS.map(k => f + "|" + k))), drawNy = deck("alias-nyq", FS.map(String));
  shell("Cazador de aliasing", `<div class="bar"><span>Caso <b id="n">1</b>/8</span><span>Aciertos: <b id="sc">0</b></span></div><canvas id="cv"></canvas><div class="q" id="q" style="min-height:0;margin-top:10px"></div><div class="opts two" id="o"></div><div class="fb" id="fb"></div>`);
  const cv = $("#cv");
  const next = () => {
    $("#n").textContent = round + 1; $("#fb").textContent = "";
    const [f, k] = round % 2 === 0 ? drawCase().split("|").map(Number) : [Number(drawNy()), pick(KS)], fs = Math.round(f * k * 10) / 10, alias = fs < 2 * f;
    const fa = Math.abs(fs - f);
    const { ctx, w, h } = setupCanvas(cv, 0.55); drawGrid(ctx, w, h, 10, 6);
    const cycles = alias ? 8 : 3, T = w / cycles, amp = h * 0.3, real = [], pts = [];
    for (let x = 0; x <= w; x += 1) real.push([x, h / 2 - amp * Math.sin(2 * Math.PI * x / T)]);
    ctx.globalAlpha = .35; trace(ctx, real, "#6bc5ff"); ctx.globalAlpha = 1;
    const Ts = T * f / fs; for (let x = 0; x <= w; x += Ts) pts.push([x, h / 2 - amp * Math.sin(2 * Math.PI * x / T)]);
    trace(ctx, pts, "#4dff9a"); ctx.fillStyle = "#ffb84d"; pts.forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], 3, 0, 7); ctx.fill(); });
    let ans, opts, why;
    if (round % 2 === 0) { $("#q").innerHTML = `Señal de <b>${f} kHz</b> muestreada a <b>${fmt(fs)} kS/s</b>. ¿Hay aliasing?`; ans = alias ? "Sí, hay aliasing" : "No, se cumple Nyquist"; opts = ["Sí, hay aliasing", "No, se cumple Nyquist"];
      why = alias ? `fs = ${fmt(fs)} < 2f = ${2 * f}: aparece una falsa de ${fmt(fa)} kHz.` : `fs = ${fmt(fs)} ≥ 2f = ${2 * f}. (Para verla bien conviene 4 a 10 muestras por período.)`; }
    else { const mn = 2 * f; $("#q").innerHTML = `Señal de <b>${f} kHz</b>. ¿Cuál es la mínima frecuencia de muestreo teórica (Nyquist)?`; ans = mn + " kS/s"; opts = shuffle([f + " kS/s", mn + " kS/s", 4 * f + " kS/s", f / 2 + " kS/s"]); why = `fs > 2f = ${mn} kS/s. En la práctica se usan 4 a 10 veces f.`; }
    $("#o").innerHTML = opts.map(o => `<button class="btn" data-o="${o}">${o}</button>`).join("");
    $("#o").querySelectorAll("button").forEach(b => b.onclick = () => {
      $("#o").querySelectorAll("button").forEach(x => { x.disabled = true; if (x.dataset.o === ans) x.classList.add("ok"); });
      const ok = b.dataset.o === ans; if (ok) { score++; $("#sc").textContent = score; } else b.classList.add("bad");
      $("#fb").className = "fb " + (ok ? "ok" : "bad"); $("#fb").textContent = (ok ? "✔ " : "✘ ") + why;
      later(() => { round++; round < 8 ? next() : finish("alias", score, "/8", "En el digital, bajar SEC/DIV baja la frecuencia de muestreo: ojo con el aliasing."); }, 2400);
    });
  };
  next();
};

function panelSVG(P, explore) {
  return `<svg viewBox="0 0 ${P.w} ${P.h}" class="fp ${explore ? "explore" : "quiz"}" style="--pbg:${P.bg};--pk:${P.pk};--pink:${P.ink}" role="img" aria-label="${P.title}">
    <defs><radialGradient id="kg" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#5b636b"/><stop offset="1" stop-color="#22272b"/></radialGradient></defs>
    <rect x="2" y="2" width="${P.w - 4}" height="${P.h - 4}" rx="18" fill="${P.bg}" stroke="#111" stroke-width="3"/>
    ${P.frame}
    ${P.items.filter(i => !i.isSec).map(i => `<g class="ctl" data-id="${i.id}">${i.svg}<rect class="hit" x="${i.box[0]}" y="${i.box[1]}" width="${i.box[2]}" height="${i.box[3]}" rx="6"/></g>`).join("")}
    <g id="hl"></g></svg>`;
}
function highlight(svg, it) {
  const [x, y, w, h] = it.box, p = 6, g = svg.querySelector("#hl");
  g.innerHTML = `<rect x="${x - p}" y="${y - p}" width="${w + 2 * p}" height="${h + 2 * p}" rx="${it.isSec ? 14 : 10}" class="ring"/>`;
  const wrap = svg.parentElement, sc = svg.clientWidth / svg.viewBox.baseVal.width;
  wrap.scrollTo({ left: Math.max(0, (x + w / 2) * sc - wrap.clientWidth / 2), behavior: "smooth" });
}

START.frente = function () {
  shell("Panel frontal", `<p>Identificá cada control o sección del panel: primero cómo se llama y después para qué sirve. En <b>Explorar</b> el panel tiene los rótulos y podés tocar cada control para estudiarlo.</p>
    <div class="opts two"><button class="btn pri" data-m="analog">Jugar: analógico</button><button class="btn pri" data-m="digital">Jugar: digital</button>
    <button class="btn" data-x="analog">Explorar analógico</button><button class="btn" data-x="digital">Explorar digital</button></div>`);
  app.querySelectorAll("[data-m]").forEach(b => b.onclick = () => frenteQuiz(b.dataset.m));
  app.querySelectorAll("[data-x]").forEach(b => b.onclick = () => frenteExplore(b.dataset.x));
};
function frenteExplore(kind) {
  const P = PANELS[kind];
  shell(`Explorar: ${P.title.toLowerCase()}`, `<p style="margin:0 0 8px;color:var(--dim);font-size:13px">Tocá cualquier control. En el celular podés deslizar el panel a los lados.</p>
    <div class="fpwrap">${panelSVG(P, true)}</div><div class="q" id="q" style="margin-top:10px">Tocá un control para ver qué es y para qué sirve.</div>
    <div class="row" style="justify-content:center"><button class="btn pri" id="play">Jugar con este panel</button></div>`);
  const svg = app.querySelector("svg.fp");
  svg.querySelectorAll(".ctl").forEach(g => g.onclick = () => { const it = P.items.find(i => i.id === g.dataset.id); highlight(svg, it);
    $("#q").innerHTML = `<b>${esc(it.name)}</b> <span style="color:var(--dim)">· ${esc(it.sec)}</span><br>${esc(it.func)}`; });
  $("#play").onclick = () => frenteQuiz(kind);
}
function frenteQuiz(kind) {
  const P = PANELS[kind], N = 8, id2 = new Map(P.items.map(i => [i.id, i]));
  const draw = deck("frente-" + kind, P.items.map(i => i.id));
  let round = 0, score = 0, cur = null;
  shell(P.title, `<div class="bar"><span>Control <b id="n">1</b>/${N}</span><span>Puntos: <b id="sc">0</b>/${2 * N}</span></div>
    <div class="fpwrap">${panelSVG(P, false)}</div>
    <div class="q" id="q" style="min-height:0;margin-top:10px"></div><div class="opts" id="o"></div><div class="fb" id="fb"></div>
    <div class="row" style="justify-content:center"><button class="btn pri" id="nx" style="display:none">Siguiente</button></div>`);
  const svg = app.querySelector("svg.fp");
  const pool = it => it.isSec ? P.items.filter(i => i.isSec) : P.items.filter(i => !i.isSec);
  const INSIDE = { a_vdiv1: "a_var1", a_vdiv2: "a_var2", a_tdiv: "a_swpvar" }; // la perilla grande rodea a su VAR: no ofrecerla como opción
  const options = (it, field) => {
    const ok = i => i !== it && i[field] !== it[field] && INSIDE[it.id] !== i.id;
    const same = shuffle(pool(it).filter(i => ok(i) && i.sec === it.sec));
    const rest = shuffle(pool(it).filter(i => ok(i) && i.sec !== it.sec));
    const pickd = same.slice(0, 2).concat(rest).slice(0, 3).map(i => i[field]);
    return shuffle([it[field], ...pickd]);
  };
  const ask = (step) => {
    const field = step === 1 ? "name" : "func";
    $("#q").innerHTML = step === 1 ? `<b>1.</b> ${cur.isSec ? "¿Qué sección es la marcada?" : "¿Cómo se llama el control marcado?"}` : `<b>2.</b> ¿Para qué sirve <b>${esc(cur.name)}</b>?`;
    $("#o").className = "opts" + (step === 1 ? " two" : ""); $("#fb").textContent = ""; $("#fb").className = "fb";
    $("#o").innerHTML = options(cur, field).map(o => `<button class="btn" style="text-align:left;font-weight:${step === 1 ? 700 : 500}">${esc(o)}</button>`).join("");
    $("#o").querySelectorAll("button").forEach(b => b.onclick = () => {
      const ok = b.textContent === cur[field];
      $("#o").querySelectorAll("button").forEach(x => { x.disabled = true; if (x.textContent === cur[field]) x.classList.add("ok"); });
      if (ok) { score++; $("#sc").textContent = score; } else b.classList.add("bad");
      $("#fb").className = "fb " + (ok ? "ok" : "bad");
      if (step === 1) { $("#fb").textContent = ok ? "✔ ¡Bien!" : `✘ Es ${cur.name}.`; later(() => ask(2), ok ? 700 : 1500); }
      else { $("#fb").innerHTML = (ok ? "✔ " : "✘ ") + esc(cur.func); $("#nx").style.display = ""; $("#nx").textContent = round + 1 < N ? "Siguiente" : "Ver resultado"; }
    });
  };
  const next = () => {
    cur = id2.get(draw()); $("#n").textContent = round + 1; $("#nx").style.display = "none";
    highlight(svg, cur); ask(1);
  };
  $("#nx").onclick = () => { round++; round < N ? next() : finish("frente-" + kind, score, "/" + 2 * N, "Si podés nombrar cada perilla y decir para qué sirve, el panel frontal está dominado."); };
  next();
}

START["frente-analog"] = () => frenteQuiz("analog");
START["frente-digital"] = () => frenteQuiz("digital");

})();
